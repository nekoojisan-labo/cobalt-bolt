<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBALT BOLT - 横スクロールアクション</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;
    font-family:'Segoe UI','Yu Gothic UI',sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:auto;
    box-shadow:0 0 0 3px #0a0e1a,0 0 40px rgba(60,120,255,.35);background:#000;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#5a6680;
    font-size:12px;letter-spacing:1px;user-select:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
<div id="hint">← → 移動 ／ Z ジャンプ ／ X ショット（長押しでチャージ） ／ Enter 決定・リスタート</div>
<script>
//======================================================================
//  COBALT BOLT  -  retro-style single-stage side-scrolling action game
//  Pure Canvas, no assets.  Logic is decoupled from rendering so it can
//  be run head-less for automated testing (see __GAME hook at the end).
//======================================================================
(()=>{
"use strict";
const HEADLESS = typeof globalThis!=='undefined' && globalThis.__HEADLESS;

// ---------- 解像度 ----------
// W,H = ワールド座標（物理・当たり判定の基準・不変）。実描画は RS 倍の 1920x1080。
const W=480, H=270, RS=4, VW=W*RS, VH=H*RS;
const canvas = (typeof document!=='undefined') ? document.getElementById('game') : {width:VW,height:VH,style:{},getContext:()=>null};
const ctx = canvas.getContext ? canvas.getContext('2d') : null;
if(ctx){ canvas.width=VW; canvas.height=VH; ctx.imageSmoothingEnabled=true; }

function fit(){
  if(HEADLESS || !ctx) return;
  canvas.width=VW; canvas.height=VH;                       // バックストアは常に 1920x1080
  const s=Math.min(innerWidth/VW, innerHeight/VH);         // ウィンドウにフィット（スムーズ拡縮）
  canvas.style.width=Math.round(VW*s)+'px'; canvas.style.height=Math.round(VH*s)+'px';
  ctx.imageSmoothingEnabled=true;
}
if(!HEADLESS && typeof window!=='undefined'){ addEventListener('resize',fit); fit(); }

// ---------- 入力 ----------
const keys={}, PRESS={};
if(!HEADLESS && typeof window!=='undefined'){
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
    if(!keys[k])PRESS[k]=true;
    keys[k]=true;
    if(!_bgmReady){ _bgmReady=true; primeBgm(); try{_actx();}catch(e){} }   // 初回キーで音声(BGM/SE)アンロック
  });
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
}
const KL='arrowleft',KR='arrowright',KJUMP='z',KSHOOT='x',KENTER='enter';

// ---------- util ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sign =v=>v<0?-1:v>0?1:0;
const rnd  =(a,b)=>a+Math.random()*(b-a);
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function px(x,y,w,h,c){ if(!ctx)return; ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

// ---------- 効果音（ロックマン風チップチューン・WebAudio合成） ----------
const SFX_SRC = {};   // ファイル音源を使う場合のみ 'type':'assets/..' を記述（現状は合成音）
const _sfxEls={};
let actx=null, _sfxMaster=null;
function _actx(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); _sfxMaster=actx.createGain(); _sfxMaster.gain.value=0.5; _sfxMaster.connect(actx.destination); }catch(e){ return null; } }
  if(actx.state==='suspended'){ try{actx.resume();}catch(e){} }
  return actx;
}
function _tone(wave,f0,f1,dur,vol,t0,delay){   // 矩形波等の単音(周波数スイープ)
  const a=actx, t=t0+(delay||0), o=a.createOscillator(), g=a.createGain();
  o.type=wave; o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_sfxMaster); o.start(t); o.stop(t+dur+0.02);
}
function _noise(dur,vol,t0,lp0,lp1,delay){     // ノイズ(爆発/被弾用)
  const a=actx, t=t0+(delay||0), n=Math.max(1,Math.floor(a.sampleRate*dur));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=a.createBufferSource(); s.buffer=buf;
  const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lp0||4000,t); if(lp1)f.frequency.exponentialRampToValueAtTime(lp1,t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(_sfxMaster); s.start(t); s.stop(t+dur+0.02);
}
function sfx(type){
  if(HEADLESS) return;
  const src=SFX_SRC[type];
  if(src && typeof Audio!=='undefined'){ try{ if(!_sfxEls[src]){const e=new Audio(src);e.volume=0.5;_sfxEls[src]=e;} const c=_sfxEls[src].cloneNode(); c.volume=0.5; c.play().catch(()=>{}); return; }catch(e){} }
  try{
    const a=_actx(); if(!a) return; const t=a.currentTime;
    if(type==='shoot'){ _tone('square',900,170,0.085,0.13,t); _tone('square',1350,520,0.05,0.05,t); }   // 通常バスター "ピュッ"
    else if(type==='chargeshot'){ _tone('square',520,120,0.24,0.17,t); _tone('sawtooth',1040,240,0.20,0.07,t); _noise(0.22,0.10,t,3600,180); _tone('square',1700,1700,0.04,0.06,t); } // チャージショット "ピョーン"
    else if(type==='hit'){ _tone('square',1500,950,0.04,0.09,t); }              // 敵に着弾 "チッ"
    else if(type==='boom'){ _noise(0.30,0.17,t,4200,90); _tone('triangle',180,48,0.28,0.12,t); _tone('square',300,80,0.10,0.05,t); }   // 撃破 爆発
    else if(type==='hurt'){ _tone('square',300,80,0.20,0.15,t); _noise(0.13,0.10,t,2000,260); }       // 被弾 "ブッ↓"
    else if(type==='die'){ _tone('square',620,70,0.55,0.16,t); _tone('square',500,60,0.55,0.12,t,0.05); _noise(0.5,0.13,t,3000,80); } // 撃破死
    else if(type==='land'){ _tone('square',210,95,0.06,0.08,t); _noise(0.05,0.06,t,1100,260); }       // 着地 "トッ"
    else if(type==='jump'){ _tone('square',330,700,0.09,0.10,t); }              // ジャンプ
    else if(type==='heal'){ _tone('square',700,700,0.07,0.13,t); _tone('square',1050,1050,0.08,0.13,t,0.08); _tone('square',1500,1500,0.10,0.12,t,0.17); } // 回復チャイム
  }catch(e){}
}
// チャージ中の持続うなり音（押し続けで上昇／離すと停止）
let _chg=null;
function chargeSnd(on, level){
  if(HEADLESS) return;
  try{
    const a=_actx(); if(!a) return; const now=a.currentTime;
    if(on){
      if(!_chg){
        const o=a.createOscillator(); o.type='square';
        const g=a.createGain(); g.gain.setValueAtTime(0.0001,now);
        const lfo=a.createOscillator(); lfo.type='square'; lfo.frequency.value=14;
        const lg=a.createGain(); lg.gain.value=0.014;          // うねりの深さ(控えめ)
        lfo.connect(lg); lg.connect(g.gain);
        o.connect(g); g.connect(_sfxMaster); o.start(); lfo.start();
        g.gain.exponentialRampToValueAtTime(0.024, now+0.06);  // フェードイン(音量を大幅に下げる)
        _chg={o,g,lfo};
      }
      _chg.o.frequency.setTargetAtTime(300+(level||0)*620, now, 0.04);   // 0→1 で 300→920Hz
      _chg.lfo.frequency.setTargetAtTime(12+(level||0)*20, now, 0.05);   // 満タンほど速いうねり
    } else if(_chg){
      const c=_chg; _chg=null;
      try{ c.g.gain.cancelScheduledValues(now); c.g.gain.setTargetAtTime(0.0001, now, 0.02);
           c.o.stop(now+0.12); c.lfo.stop(now+0.12); }catch(e){}
    }
  }catch(e){}
}

// ---------- BGM（オープニング/通常/ボスで自動切替・ループ） ----------
const BGM = {
  title : 'assets/bgm_asteroid.mp3',      // オープニング = Asteroid Belt
  normal: 'assets/bgm_interceptor.mp3',   // 通常エリア   = Interceptor Fleet
  boss  : 'assets/bgm_mastercore.mp3',    // ボス         = Master Core Awakening
};
let _bgmEls={}, _bgmCur=null, _bgmReady=false;
function getBgm(src){
  if(!src||HEADLESS||typeof Audio==='undefined') return null;
  if(_bgmEls[src]) return _bgmEls[src];
  const a=new Audio(src); a.loop=true; a.volume=0.42; a.preload='auto'; _bgmEls[src]=a; return a;
}
function primeBgm(){ const seen={}; for(const k in BGM){ const s=BGM[k]; if(!s||seen[s])continue; seen[s]=1; const a=getBgm(s); if(a){ a.play().then(()=>a.pause()).catch(()=>{}); } } }
function playBgm(src){
  if(!src){ if(_bgmCur){const o=_bgmEls[_bgmCur];if(o)o.pause();} _bgmCur=null; return; }
  if(_bgmCur===src){ const a=_bgmEls[src]; if(a&&a.paused)a.play().catch(()=>{}); return; }
  if(_bgmCur){ const o=_bgmEls[_bgmCur]; if(o)o.pause(); }
  _bgmCur=src; const a=getBgm(src); if(a){ try{a.currentTime=0;}catch(e){} a.play().catch(()=>{}); }
}
function manageBgm(){            // 毎フレーム呼ぶ（状態に応じてBGM切替）
  if(!_bgmReady) return;
  if(state==='title')      playBgm(BGM.title);
  else if(state==='play')  playBgm((bossActive && BGM.boss) ? BGM.boss : BGM.normal);
  else                     playBgm(null);   // loading/dead/clear は停止
}

//======================================================================
//  高精細スプライト・エンジン（任意）
//  assets/ にPNGスプライトシートを置き、下のASSETSを設定すると有効化。
//  画像が無い／未ロードのときは自動で従来のコード描画にフォールバックする。
//======================================================================
// 各エンティティ＝{fw,fh,scale,ax,ay, anims:{name:{src,frames,fps}}}。
// anim毎に1枚の横ストリップPNG（コマを横一列）。素材配置後にここを記述する。
// ★キャッシュ無効化: 素材PNGを差し替えたら ASSET_VER を変えると、ブラウザ/CDNが必ず新素材を取得する。
const ASSET_VER = '2026053108';
function _av(s){ return s + (s.indexOf('?')<0 ? '?v=' : '&v=') + ASSET_VER; }
const ASSETS = {
  // 高精細2D(塗り)。scale/ayは見た目に合わせて調整。未生成のanimはidleへ自動フォールバック。
  player:{ fw:256, fh:256, scale:0.16, ax:0.5, ay:0.98, anims:{
    idle  :{src:'assets/player_idle.png',  frames:5, fps:6},
    run   :{src:'assets/player_run.png',   frames:8, fps:18},
    jump  :{src:'assets/player_jump.png',  frames:2, fps:6},
    jumpshoot:{src:'assets/player_jumpshoot.png', frames:2, fps:6},
    shoot :{src:'assets/player_shoot.png', frames:2, fps:14},
    charge:{src:'assets/player_charge.png',frames:5, fps:12},
    hurt  :{src:'assets/player_hurt.png',  frames:2, fps:10},
    runshoot:{src:'assets/player_runshoot.png', frames:8, fps:18},  // 走り撃ち(runと同テンポ)
  }},
  met:{ fw:128, fh:128, scale:0.22, ax:0.5, ay:1, anims:{
    hide:{src:'assets/enemy_met_hide.png', frames:1, fps:1},
    open:{src:'assets/enemy_met_open.png', frames:3, fps:8},
    idle:{src:'assets/enemy_met_hide.png', frames:1, fps:1},
  }},
  walker:{ fw:128, fh:128, scale:0.22, ax:0.5, ay:1, anims:{
    walk:{src:'assets/enemy_walker.png', frames:4, fps:8},
    idle:{src:'assets/enemy_walker.png', frames:4, fps:8},
  }},
  flyer:{ fw:128, fh:128, scale:0.2, ax:0.5, ay:1, anims:{
    fly :{src:'assets/enemy_flyer.png', frames:4, fps:12},
    idle:{src:'assets/enemy_flyer.png', frames:4, fps:12},
  }},
  turret:{ fw:128, fh:128, scale:0.26, ax:0.5, ay:1, anims:{
    idle:{src:'assets/enemy_turret.png',      frames:1, fps:1},
    fire:{src:'assets/enemy_turret_fire.png', frames:2, fps:12},
  }},
  boss:{ fw:512, fh:512, scale:0.13, ax:0.5, ay:1, anims:{
    idle :{src:'assets/boss_idle.png',  frames:2, fps:4},
    jump :{src:'assets/boss_jump.png',  frames:2, fps:6},
    shoot:{src:'assets/boss_shoot.png', frames:3, fps:10},
    dash :{src:'assets/boss_dash.png',  frames:2, fps:10},
    death:{src:'assets/boss_death.png', frames:4, fps:6},
  }},
};
function loadAssets(){
  if(typeof Image==='undefined') return;   // ブラウザ/検証環境でImageがあるときのみ
  for(const k in ASSETS){ const a=ASSETS[k];
    for(const name in (a.anims||{})){ const an=a.anims[name]; if(!an.src) continue;
      const im=new Image(); an.ready=false; an.settled=false; im.onload=()=>{an.ready=true;an.settled=true;}; im.onerror=()=>{an.settled=true;}; im.src=_av(an.src); an.img=im;
    }
  }
  loadRig();   // パーツ分割リグの素材も読み込む
  loadSkel();  // 骨格用 塗りパーツ
}
// 足元(底辺中央)のスクリーン座標 footX/footY に、anim の現在コマを描く。dir<0で反転。
function drawSheet(key, anim, time, footX, footY, dir, frame){
  const a=ASSETS[key]; if(!a || !ctx) return false;
  let an=a.anims[anim]; if(!an || !an.ready) an=a.anims.idle;   // 無ければidleで代用
  if(!an || !an.ready || !an.img) return false;
  const fw=a.fw, fh=a.fh, sc=a.scale||1, w=fw*sc, h=fh*sc, n=an.frames||1;
  const f=(frame!=null ? (((frame%n)+n)%n) : (an.fps ? Math.floor(time*an.fps/60)%n : 0));  // frame指定時は固定(ジャンプの揺れ防止)
  const sxp=f*fw, syp=0;
  const dx=Math.round(footX - w*(a.ax!=null?a.ax:0.5)), dy=Math.round(footY - h*(a.ay!=null?a.ay:1));
  ctx.save();
  if(dir<0){ ctx.translate(dx+w,0); ctx.scale(-1,1); ctx.drawImage(an.img, sxp,syp,fw,fh, 0,dy, w,h); }
  else ctx.drawImage(an.img, sxp,syp,fw,fh, dx,dy, w,h);
  ctx.restore();
  return true;
}

//======================================================================
//  パーツ分割リグ（任意・塗りPNGが揃えば優先／無ければコード描画リグへ）
//  設計: 各パーツは「フルボディ共通キャンバス(fw×fh)に該当パーツのみ描画・他は透過」。
//  脚→胴+頭→腕+武器 の順で同一矩形に重ねるとキャラが再構成される。各パーツを
//  独立に差し替え/アニメできるので、走り撃ち=脚run+腕fireで“腕だけ伸ばしっぱなし”。
//  共通キャンバス基準なので別々生成でも肩・接地の位置が自動で揃う。
//======================================================================
const RIG = {
  player:{ fw:256, fh:256, scale:0.17, ax:0.5, ay:0.99, parts:{
    legs:      {src:'assets/rig_player_legs.png',      frames:6},  // 横ストリップ [0]idle/1-4 run/5 jump
    body:      {src:'assets/rig_player_body.png',      frames:1},  // 胴+頭+ヘルメット(静止)
    arm_down:  {src:'assets/rig_player_arm_down.png',  frames:1},  // 待機の腕(下げ)
    arm_fire:  {src:'assets/rig_player_arm_fire.png',  frames:1},  // 前方へ伸ばした射撃腕
    arm_charge:{src:'assets/rig_player_arm_charge.png',frames:2},  // チャージ保持の腕
  }, legMap:{ idle:[0], run:[1,2,3,4], jump:[5], hurt:[0] } },
  boss:{ fw:512, fh:512, scale:0.135, ax:0.5, ay:1, parts:{
    body:      {src:'assets/rig_boss_body.png',      frames:2},    // 本体(浮遊/呼吸)
    arm_idle:  {src:'assets/rig_boss_arm_idle.png',  frames:1},    // 専用キャノン(構え)
    arm_charge:{src:'assets/rig_boss_arm_charge.png',frames:2},    // 溜め
    arm_fire:  {src:'assets/rig_boss_arm_fire.png',  frames:2},    // 発射
  } },
};
function loadRig(){
  if(typeof Image==='undefined') return;
  for(const k in RIG){ const r=RIG[k];
    for(const pn in r.parts){ const p=r.parts[pn]; if(!p.src) continue;
      const im=new Image(); p.ready=false; p.settled=false;
      im.onload=()=>{p.ready=true;p.settled=true;}; im.onerror=()=>{p.settled=true;}; im.src=_av(p.src); p.img=im;
    }
  }
}
// 1パーツ(frame f)を共通キャンバス基準で footX/footY(底辺中央)へ描く。dir<0で反転。
function drawRigPart(rig, part, f, footX, footY, dir){
  if(!part||!part.ready||!part.img||!ctx) return;
  const fw=rig.fw, fh=rig.fh, sc=rig.scale, w=fw*sc, h=fh*sc, n=part.frames||1;
  const fi=((Math.floor(f)%n)+n)%n, sxp=fi*fw;
  const dx=Math.round(footX - w*rig.ax + (part.ox||0)), dy=Math.round(footY - h*rig.ay + (part.oy||0));  // ox/oyでパーツ毎に微調整可
  if(dir<0){ ctx.save(); ctx.translate(dx+w,0); ctx.scale(-1,1); ctx.drawImage(part.img,sxp,0,fw,fh,0,dy,w,h); ctx.restore(); }
  else ctx.drawImage(part.img,sxp,0,fw,fh,dx,dy,w,h);
}
// プレイヤーをパーツ合成。必須(脚+胴)が揃わなければ false→コード描画へ。
function drawPlayerRig(legState, armState, legFrame, armFrame, footX, footY, dir){
  const r=RIG.player, P=r.parts;
  // 全パーツが揃うまでは発動しない（前腕欠け等の半端表示を避け、従来の塗りへフォールバック）
  if(!P.legs.ready || !P.body.ready || !P.arm_down.ready || !P.arm_fire.ready || !P.arm_charge.ready) return false;
  const armKey = armState==='charge'?'arm_charge' : armState==='fire'?'arm_fire' : 'arm_down';
  const arm = P[armKey] && P[armKey].ready ? P[armKey] : (P.arm_down.ready?P.arm_down:null);
  const lf = r.legMap[legState] || r.legMap.idle;
  drawRigPart(r, P.legs, lf[legFrame%lf.length], footX, footY, dir);  // 脚(奥)
  drawRigPart(r, P.body, 0, footX, footY, dir);                       // 胴+頭
  if(arm) drawRigPart(r, arm, armFrame, footX, footY, dir);           // 腕+バスター(前)
  return true;
}
// ボスをパーツ合成。必須(本体)が無ければ false→コード描画へ。
function drawBossRig(armState, footX, footY, dir, t){
  const r=RIG.boss, P=r.parts;
  if(!P.body.ready || !P.arm_idle.ready || !P.arm_charge.ready || !P.arm_fire.ready) return false;
  const armKey = armState==='charge'?'arm_charge' : armState==='fire'?'arm_fire' : 'arm_idle';
  const arm = P[armKey] && P[armKey].ready ? P[armKey] : (P.arm_idle.ready?P.arm_idle:null);
  drawRigPart(r, P.body, t*0.08, footX, footY, dir);                  // 本体(奥)
  if(arm) drawRigPart(r, arm, t*0.12, footX, footY, dir);            // キャノン(前)
  return true;
}

// ---- 弾・汎用画像（assets配置で有効・無ければ図形描画にフォールバック）----
const BULLET_SPR = {
  buster:{src:'assets/bullet_buster.png', size:18, frames:2, fps:16},
  charge:{src:'assets/bullet_charge.png', size:30, frames:2, fps:12},
  enemy :{src:'assets/bullet_enemy.png',  size:15, frames:2, fps:14},
};
const _imgreg={};
function getImg(src){
  if(!src) return null;
  if(_imgreg[src]) return _imgreg[src];
  const o={ready:false,settled:false,img:null}; _imgreg[src]=o;
  if(typeof Image!=='undefined'){ const im=new Image(); im.onload=()=>{o.ready=true;o.settled=true;}; im.onerror=()=>{o.settled=true;}; im.src=_av(src); o.img=im; }
  return o;
}
// ---- プリローダー（全アセット読込後にタイトル表示。最初のチラつき防止）----
let _preloadList=null;
function preloadAll(){
  if(typeof Image==='undefined') return;
  const list=[], add=o=>{ for(const k in o){ const c=o[k]; if(c&&c.src) list.push(c.src); } };
  add(BULLET_SPR); add(ITEM_SPR); add(UI_SPR); add(FX_SPR); add(TERRAIN); add(BG);
  for(const s of list) getImg(s);   // 読込開始
  _preloadList=list;
}
function preloadProgress(){
  let total=0, done=0;
  for(const k in ASSETS){ const a=ASSETS[k]; for(const n in (a.anims||{})){ const an=a.anims[n]; if(!an.src)continue; total++; if(an.settled)done++; } }
  for(const k in RIG){ const r=RIG[k]; for(const pn in r.parts){ const p=r.parts[pn]; if(!p.src)continue; total++; if(p.settled)done++; } }
  for(const k in SKEL){ const p=SKEL[k]; if(!p.src)continue; total++; if(p.settled)done++; }
  if(_preloadList) for(const s of _preloadList){ total++; const r=_imgreg[s]; if(r&&r.settled)done++; }
  return total? done/total : 1;
}
// 弾の中心(b.x+b.w/2, b.y+b.h/2)にスプライトを描く。vx<0で水平反転。
function drawBulletSpr(cfg,b){
  if(!cfg||!cfg.src||!ctx) return false;
  const r=getImg(cfg.src); if(!r||!r.ready||!r.img) return false;
  const s=cfg.size||14, n=cfg.frames||1, iw=r.img.width, ih=r.img.height, fw=iw/n;
  const f=cfg.fps?Math.floor((b.life||0)*cfg.fps/60)%n:0;   // life基準でアニメ
  const cx=Math.round(b.x-camX+b.w/2), cy=Math.round(b.y+b.h/2);
  ctx.save();
  if(b.vx<0){ ctx.translate(cx+ s/2,0); ctx.scale(-1,1); ctx.drawImage(r.img, f*fw,0,fw,ih, 0,cy-s/2, s,s); }
  else ctx.drawImage(r.img, f*fw,0,fw,ih, cx-s/2,cy-s/2, s,s);
  ctx.restore();
  return true;
}

const PW=18, PH=24;
const player={x:80,y:GROUND_Y-PH,w:PW,h:PH,vx:0,vy:0,dir:1,onGround:false,
  hp:24,maxhp:24,inv:0,shootCD:0,charge:0,wasShoot:false,fireHold:0,
  dead:false,deadT:0,coyote:0,jumpBuf:0,anim:0,blink:0};
function resetPlayer(){
  Object.assign(player,{x:80,y:GROUND_Y-PH,vx:0,vy:0,dir:1,onGround:false,
    hp:24,maxhp:24,inv:0,shootCD:0,charge:0,wasShoot:false,fireHold:0,
    dead:false,deadT:0,coyote:0,jumpBuf:0,anim:0,blink:0});
}

const GRAV=0.5, MOVE=3.2, JUMP=-8.6, TERM=9;   // MOVE: 歩き2.3→ダッシュ3.2

function collideX(o){
  o.x+=o.vx;
  if(o.vx===0) return;                 // 移動していなければ横解決しない（埋まり時の誤ワープ防止）
  for(const s of solids) if(aabb(o,s)){ o.x = o.vx>0 ? s.x-o.w : s.x+s.w; o.vx=0; }
}
function collideY(o){
  o.y+=o.vy; o.onGround=false;
  for(const s of solids) if(aabb(o,s)){
    if(o.vy>0){o.y=s.y-o.h;o.onGround=true;} else if(o.vy<0)o.y=s.y+s.h;
    o.vy=0;
  }
}

function updatePlayer(){
  if(player.dead){ chargeSnd(false); player.deadT++; return; }   // 死亡中はチャージ音を止める
  // 横
  let mv=0;
  if(keys[KL]){mv=-1;player.dir=-1;}
  if(keys[KR]){mv= 1;player.dir= 1;}
  player.vx=mv*MOVE;
  // コヨーテ＆ジャンプバッファ
  if(player.onGround)player.coyote=6; else if(player.coyote>0)player.coyote--;
  if(PRESS[KJUMP])player.jumpBuf=6; else if(player.jumpBuf>0)player.jumpBuf--;
  if(player.jumpBuf>0 && player.coyote>0){
    player.vy=JUMP; player.jumpBuf=0; player.coyote=0; player.onGround=false; sfx('jump');
    spawnFx('dust', player.x+player.w/2, player.y+player.h);
  }
  if(!keys[KJUMP] && player.vy<-3) player.vy=-3; // 可変ジャンプ
  player.vy=clamp(player.vy+GRAV,-20,TERM);
  collideX(player);
  const fallV=player.vy;                 // 着地判定用に落下速度を退避(collideYでvyが0になる前)
  collideY(player);
  if(!player.wasGround && player.onGround){ spawnFx('dust', player.x+player.w/2, player.y+player.h); if(fallV>2.2) sfx('land'); } // 着地煙＋一定以上の落下で着地音
  player.wasGround=player.onGround;
  if(player.onGround && mv!==0) player.anim+=0.34; else player.anim=0;   // 脚アニメをダッシュ相当に速く

  // ショット
  if(player.shootCD>0)player.shootCD--;
  const sh=!!keys[KSHOOT];
  if(sh)player.charge=Math.min(player.charge+1,60);
  if(PRESS[KSHOOT] && player.shootCD<=0){           // 押した瞬間に通常弾
    shootP(player.x+(player.dir>0?20:-12), player.y-3, player.dir, false);   // 塗り2D砲口に合わせた発射位置
    player.shootCD=11;
  }
  if(player.wasShoot && !sh){                        // 離した瞬間：チャージ判定
    if(player.charge>=40) shootP(player.x+(player.dir>0?16:-16), player.y-7, player.dir, true);
    player.charge=0;
  }
  player.wasShoot=sh;
  if(sh && player.charge>=8) chargeSnd(true, player.charge/60); else chargeSnd(false); // チャージ中のうなり(タップでは鳴らさない)

  if(player.inv>0)player.inv--;
  if(player.fireHold>0)player.fireHold--;
  player.blink++;

  if(player.y>H+60) hurt(99,true);  // 落下死
}

function hurt(dmg,fall){
  if(player.dead) return;
  if(player.inv>0 && !fall) return;
  player.hp-=dmg; player.inv=72;
  if(player.hp<=0){player.hp=0;player.dead=true;player.deadT=0;sfx('die');}  // 死亡音
  else{ sfx('hurt'); if(!fall){player.vy=-3.5;player.vx=-player.dir*2;} }
}

const fx=[];
function boom(x,y,col){ for(let i=0;i<10;i++){const a=i/10*Math.PI*2;fx.push({x,y,vx:Math.cos(a)*rnd(1,3),vy:Math.sin(a)*rnd(1,3),life:rnd(14,26),col});} }
function updateFx(){ for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;} for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1); }

}
function drawEffects(){

  for(const e of effects){ const c=FX_SPR[e.type]; if(!c||!c.src)continue; const r=getImg(c.src); if(!r||!r.ready||!r.img)continue;
    const n=c.frames||1, fw=r.img.width/n, ih=r.img.height, s=c.size||32;
    let f=Math.floor(e.t*(c.fps||20)/60); f=Math.min(f,n-1);

    ctx.save();
    if(e.dir<0){ ctx.translate(Math.round(e.x-camX)+s/2,0); ctx.scale(-1,1); ctx.drawImage(r.img, f*fw,0,fw,ih, 0,y, s,s); }
    else ctx.drawImage(r.img, f*fw,0,fw,ih, Math.round(e.x-camX-s/2),y, s,s);

  }
}

let enemies=[], spawns=[];
const mkE=(type,x,y,o={})=>Object.assign({type,x,y,w:20,h:18,hp:2,alive:true,t:0,vx:0,vy:0,
  dir:-1,hit:0,onGround:false,phase:'hide',timer:0,baseY:y,deathT:0},o);

// 配置ポイント方式：画面に入ると出現／十分離れると消滅／戻ると配置点でプレイヤーへ向き合って復活
function buildEnemies(){
  enemies=[];
  const g=(type,x,o={})=>({type,x,y:GROUND_Y-28,opts:Object.assign({w:type==='turret'?24:22,h:28},o),active:false,enemy:null});
  const a=(type,x,y,o={})=>({type,x,y,opts:o,active:false,enemy:null});
  spawns=[
    g('met',380,{hp:2}),          g('walker',560,{hp:2,dir:-1}),
    a('flyer',760,160,{w:24,h:22,hp:1}),   a('met',840,176-28,{w:22,h:28,hp:2}),
    g('walker',1000,{hp:2,dir:1}), g('turret',1110,{hp:3}),
    a('flyer',1380,150,{w:24,h:22,hp:1}),  a('walker',1450,158-28,{w:22,h:28,hp:2,dir:1}),
    g('met',1700,{hp:2}),          a('turret',2310,158-28,{w:24,h:28,hp:3}),
    g('walker',2200,{hp:2,dir:-1}), a('flyer',2420,160,{w:24,h:22,hp:1}),
    g('met',2720,{hp:2}),          g('walker',2960,{hp:2,dir:1}),
    a('flyer',3100,155,{w:24,h:22,hp:1}),  g('met',3450,{hp:2}),  g('turret',3560,{hp:3}),
  ];
}
function manageSpawns(){
  const PAD=48, DESP=W*0.6;                       // 出現マージン/消滅距離
  for(const sp of spawns){
    if(sp.active){
      const cx=(sp.enemy&&sp.enemy.alive)?sp.enemy.x:sp.x;
      if(cx<camX-DESP || cx>camX+W+DESP){          // 画面から十分離れた→スロット解放
        if(sp.enemy&&sp.enemy.alive){ const i=enemies.indexOf(sp.enemy); if(i>=0)enemies.splice(i,1); }
        sp.active=false; sp.enemy=null;
      }
    } else if(sp.x>=camX-PAD && sp.x<=camX+W+PAD){  // 画面に入った→復活
      const e=mkE(sp.type, sp.x, sp.y, Object.assign({},sp.opts));
      e.dir=sign(player.x-sp.x)||-1;               // プレイヤーへ向き合う
      if(sp.type==='flyer')e.baseY=sp.y;
      enemies.push(e); sp.enemy=e; sp.active=true;
    }
  }
}

function eGravity(o){
  o.vy=clamp(o.vy+GRAV,-20,TERM); o.y+=o.vy; o.onGround=false;
  for(const s of solids) if(aabb(o,s)){ if(o.vy>0){o.y=s.y-o.h;o.onGround=true;} else o.y=s.y+s.h; o.vy=0; }
}
function patrol(o,spd){
  // 進行方向の足元に床が無ければ反転、壁でも反転
  const footX = o.dir>0 ? o.x+o.w+1 : o.x-1;
  const footY = o.y+o.h+2;
  let ground=false, wall=false;
  for(const s of solids){
    if(footX>=s.x && footX<=s.x+s.w && footY>=s.y && footY<=s.y+10) ground=true;
  }
  o.x += o.dir*spd;
  for(const s of solids) if(aabb(o,s)){ o.x = o.dir>0 ? s.x-o.w : s.x+s.w; wall=true; }
  if(!ground || wall) o.dir*=-1;
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive){e.deathT++;continue;}
    e.t++; if(e.hit>0)e.hit--;
    const seen = e.x>camX-80 && e.x<camX+W+80;

    if(e.type==='met'){
      eGravity(e); e.timer++;
      if(e.phase==='hide'){ if(seen && e.timer>60){e.phase='open';e.timer=0;} }
      else { // open
        if(e.timer===16){
          const d=sign(player.x-e.x)||-1;
          shootE(e.x+e.w/2,e.y+6,d*2.4,-1.3,'#ffd23f');
          shootE(e.x+e.w/2,e.y+6,d*2.8, 0  ,'#ffd23f');
          shootE(e.x+e.w/2,e.y+6,d*2.4, 1.3,'#ffd23f');
        }
        if(e.timer>70){e.phase='hide';e.timer=0;}
      }
    }
    else if(e.type==='walker'){ eGravity(e); patrol(e,0.8); }
    else if(e.type==='flyer'){
      e.x-=0.95; e.y=e.baseY+Math.sin(e.t*0.07)*24;   // 復活は manageSpawns が担当
    }
    else if(e.type==='turret'){
      eGravity(e); e.timer++;
      if(seen && e.timer>90){
        e.timer=0;
        const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
        shootE(e.x+e.w/2,e.y+8,dx/d*2.6,dy/d*2.6,'#5ad1ff');
      }
    }

    if(!player.dead && aabb(player,e)) hurt(2,false);
  }
  for(let i=enemies.length-1;i>=0;i--) if(!enemies[i].alive && enemies[i].deathT>16) enemies.splice(i,1);
}

//======================================================================
//  ボス
//======================================================================
let boss=null, bossActive=false, gate=false, warnT=0;
function spawnBoss(){
  boss={x:ROOM_X+360,y:GROUND_Y-46,w:36,h:46,hp:60,maxhp:60,vx:0,vy:0,dir:-1,
    onGround:false,state:'intro',timer:0,hit:0,jumps:0,dead:false,deadT:0};
  bossActive=true; gate=true; warnT=90;
}
function bossPick(){
  const r=Math.random();
  boss.state = r<0.4?'jump' : r<0.72?'shoot' : 'dash';
  boss.timer=0; boss.jumps=0;
}
function updateBoss(){
  if(!boss)return;
  if(warnT>0)warnT--;
  boss.timer++; if(boss.hit>0)boss.hit--;
  eGravity(boss);
  if(boss.dead){boss.deadT++; if(boss.deadT%10===0){boom(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),'#ff7a00'); spawnFx('explosion', boss.x+rnd(4,boss.w-4), boss.y+rnd(4,boss.h-4));} return;}
  if(boss.state==='intro'){ if(boss.timer>90){boss.state='think';boss.timer=0;} return; }

  boss.dir = player.x < boss.x ? -1 : 1;

  if(boss.state==='think'){ boss.vx=0; if(boss.timer>36) bossPick(); }
  else if(boss.state==='jump'){
    if(boss.onGround){ boss.vy=JUMP*1.02; boss.vx=boss.dir*2.3; boss.jumps++; }
    boss.x+=boss.vx;
    for(const s of solids) if(aabb(boss,s)){ boss.x = boss.vx>0 ? s.x-boss.w : s.x+s.w; boss.vx*=-1; }
    if(boss.onGround && boss.jumps>=2){ boss.state='shoot'; boss.timer=0; boss.vx=0; }
  }
  else if(boss.state==='shoot'){
    if(boss.timer===18||boss.timer===38||boss.timer===58){
      const mzx=boss.x+boss.w/2 + boss.dir*28, mzy=boss.y+13;   // 専用キャノンの砲口(前方の先端)から発射
      spawnFx('muzzle', mzx, mzy, boss.dir);
      for(let i=-2;i<=2;i++){
        const ang=(boss.dir>0?0:Math.PI)+i*0.30;
        shootE(mzx, mzy, Math.cos(ang)*3.1, Math.sin(ang)*3.1, '#ff7a00');
      }
    }
    if(boss.timer>78){ boss.state='think'; boss.timer=0; }
  }
  else if(boss.state==='dash'){
    boss.vx=boss.dir*4.6; boss.x+=boss.vx;
    for(const s of solids) if(aabb(boss,s)){ boss.x = boss.vx>0 ? s.x-boss.w : s.x+s.w; boss.state='think'; boss.timer=0; }
    if(boss.timer>48){ boss.state='think'; boss.timer=0; }
  }

  boss.x=clamp(boss.x, ROOM_X+20, ROOM_X+W-boss.w-20);
  if(!player.dead && aabb(player,boss)) hurt(4,false);
}

//======================================================================
//  弾の更新＋当たり
//======================================================================
function updateBullets(){
  for(const b of pBullets){
    b.x+=b.vx; b.life--;
    for(const s of solids) if(s.h>=40 && aabb(b,s)){ b.life=0; boom(b.x,b.y,'#9fd8ff'); }  // 薄い足場は貫通(地面/壁のみ阻む)
    if(b.life<=0) continue;
    for(const e of enemies){
      if(!e.alive) continue;
      if(aabb(b,e)){
        const guarded = (e.type==='met' && e.phase==='hide'); // メットは隠れてると無敵
        if(guarded){ if(!b.charge){b.life=0;} boom(b.x,b.y,'#ffd23f'); }
        else{
          e.hp-=b.dmg; e.hit=6; spawnFx('hit', b.x, b.y+b.h/2);
          if(e.hp<=0){ e.alive=false; e.deathT=0; boom(e.x+e.w/2,e.y+e.h/2,'#ff9a3c'); spawnFx('explosion', e.x+e.w/2, e.y+e.h/2); dropItem(e.x+e.w/2, e.y+e.h/2); sfx('boom'); }
          else sfx('hit');
          if(!b.charge){ b.life=0; }
        }
        if(!b.charge) break;
      }
    }
    if(b.life<=0) continue;
    if(boss && !boss.dead && boss.state!=='intro' && aabb(b,boss)){
      boss.hp-=b.dmg; boss.hit=6; spawnFx('hit', b.x, b.y+b.h/2); sfx('hit');
      if(!b.charge) b.life=0;
      if(boss.hp<=0){ boss.hp=0; boss.dead=true; boss.deadT=0; sfx('boom'); }
    }
  }
  for(const b of eBullets){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    for(const s of solids) if(s.h>=40 && aabb(b,s)){ b.life=0; }  // 敵弾も薄い足場は貫通
    if(b.life>0 && !player.dead && aabb(b,player)){ hurt(2,false); b.life=0; }
  }
  for(let i=pBullets.length-1;i>=0;i--) if(pBullets[i].life<=0) pBullets.splice(i,1);
  for(let i=eBullets.length-1;i>=0;i--) if(eBullets[i].life<=0) eBullets.splice(i,1);
}

let items=[];
const ITEM_SPR={  // assets配置で画像化。無ければ図形フォールバック。
  heal_s:{src:'assets/item_heal_s.png', size:22},
  heal_l:{src:'assets/item_heal_l.png', size:30},
};
const ITEM_HEAL={ heal_s:8, heal_l:24 };
function buildItems(){ items=[]; }                       // 固定配置なし＝敵のランダムドロップ式
// 敵撃破時に確率ドロップ（小80%/大20%）。落下して地面に乗る。
function dropItem(x,y,bigChance){
  if(Math.random()>=0.24) return;                        // ドロップ率24%
  const big=Math.random()<(bigChance||0.2);
  const w=big?18:16, h=big?18:16;
  items.push({type:big?'heal_l':'heal_s', x:x-w/2, y:y-h/2, w, h, taken:false, t:0, vy:0});
}
function updateItems(){
  for(const it of items){
    if(it.taken) continue; it.t++;
    // 簡易重力で地面に着地
    it.vy=clamp((it.vy||0)+GRAV,-20,TERM); it.y+=it.vy;
    for(const s of solids) if(aabb(it,s)){ if(it.vy>0){it.y=s.y-it.h;it.vy=0;} else if(it.vy<0){it.y=s.y+s.h;it.vy=0;} }
    if(it.y>H+40) it.taken=true;                          // 穴に落ちたら消滅
    if(!player.dead && player.hp>0 && aabb(player,it)){
      it.taken=true;
      player.hp=Math.min(player.maxhp, player.hp+(ITEM_HEAL[it.type]||0));
      sfx('heal'); boom(it.x+it.w/2, it.y+it.h/2, '#7fff9f');
    }
  }
  for(let i=items.length-1;i>=0;i--) if(items[i].taken && items[i].t>30) items.splice(i,1);  // 掃除
}
function drawItems(){
  for(const it of items){
    if(it.taken) continue;
    const bob=Math.sin(it.t*0.1)*2, x=it.x-camX, y=it.y+bob, big=it.type==='heal_l';
    const cfg=ITEM_SPR[it.type];
    if(cfg && cfg.src){ const r=getImg(cfg.src); if(r&&r.ready&&r.img){ const s=cfg.size||20;
      ctx&&ctx.drawImage(r.img,0,0,r.img.width,r.img.height, Math.round(it.x-camX+it.w/2-s/2), Math.round(it.y+it.h/2-s/2+bob), s,s); continue; } }
    // フォールバック図形（回復カプセル＋十字）
    px(x,y,it.w,it.h, big?'#0e3a1c':'#123a20');
    px(x+1,y+1,it.w-2,it.h-2, big?'#3ad06a':'#7fff9f');
    px(x+(it.w>>1)-1,y+3,2,it.h-6,'#ffffff'); px(x+3,y+(it.h>>1)-1,it.w-6,2,'#ffffff');
  }
}
function drawHazards(){
  for(const hz of hazards){
    if(hz.x+hz.w<camX||hz.x>camX+W) continue;
    const x=hz.x-camX;
    px(x,hz.y,hz.w,hz.h,'#3a0a12');
    for(let i=0;i<hz.w;i+=6){ px(x+i,hz.y-5,5,5,'#c2304a'); px(x+i+1,hz.y-5,3,3,'#ff5a78'); } // 棘
  }
}

//======================================================================
//  状態管理
//======================================================================
let state = HEADLESS ? 'title' : 'loading';   // loading / title / play / dead / clear
let clearT=0, shake=0, loadingT=0;

function startGame(){
  resetPlayer(); buildEnemies(); buildItems();
  pBullets.length=0; eBullets.length=0; fx.length=0; effects.length=0;
  boss=null; bossActive=false; gate=false; warnT=0;
  camX=0; clearT=0; state='play';
}

function update(){
  manageBgm();   // 状態に応じてBGM切替（毎フレーム）
  if(state==='loading'){ loadingT++; if(preloadProgress()>=1 || loadingT>420) state='title'; return; }  // 全アセット読込後にタイトルへ
  if(state==='title'){ if(PRESS[KENTER]) startGame(); return; }
  if(state==='dead'){ player.deadT++; if(PRESS[KENTER]) startGame(); return; }
  if(state==='clear'){ clearT++; if(PRESS[KENTER]) state='title'; return; }

  updatePlayer();
  manageSpawns();          // 配置ポイント→出現/消滅/復活
  updateEnemies();
  updateItems();
  for(const hz of hazards){ if(!player.dead && aabb(player,hz)) hurt(2,false); }  // スパイク帯

  if(!bossActive && player.x>BOSS_TRIGGER) spawnBoss();
  if(bossActive){
    player.x=clamp(player.x, ROOM_X+14, ROOM_X+W-player.w-6); // 部屋に閉じ込め
    updateBoss();
    if(boss.dead && boss.deadT>110){ state='clear'; }
  }

  updateBullets();
  updateFx();
  updateEffects();

  // カメラ
  let tgt = bossActive ? ROOM_X : clamp(player.x-W/2+player.w/2, 0, LEVEL_W-W);
  camX += (tgt-camX)*0.2;
  if(Math.abs(tgt-camX)<0.5) camX=tgt;
  if(shake>0)shake--;

  if(player.dead && player.deadT>80 && state==='play') state='dead';
}

const now=()=> (typeof performance!=='undefined'&&performance.now)?performance.now():0;

// 画像背景（パララックス・当たり判定なし）。assets配置で有効、無ければ下のコード背景。
const BG = {
  far :{src:'assets/bg_far.png',  speed:0.15},
  mid :{src:'assets/bg_mid.png',  speed:0.40},
  near:{src:'assets/bg_near.png', speed:0.70},
};
function drawBgLayer(cfg){
  if(!cfg||!cfg.src||!ctx) return;
  const r=getImg(cfg.src); if(!r||!r.ready||!r.img) return;
  const iw=r.img.width, ih=r.img.height, sy=H/ih, dw=Math.max(1,iw*sy);  // 高さをワールドHに合わせ横タイル

  for(let x=off; x<W; x+=dw) ctx.drawImage(r.img, 0,0,iw,ih, Math.round(x),0, Math.ceil(dw),H);

function bg(){
  if(!ctx)return;
  // 画像背景が1層でも読み込めていれば、それを優先（コード背景はスキップ）
  if(BG.far||BG.mid||BG.near){

  for(const c of [[8,-6,4],[-9,4,5],[2,9,3]]){ for(let dy=-c[2];dy<=c[2];dy++) for(let dx=-c[2];dx<=c[2];dx++) if(dx*dx+dy*dy<=c[2]*c[2]) px(mx+c[0]+dx,my+c[1]+dy,1,1,'#e3d8ba'); }
  // 星
  for(let i=0;i<46;i++){
    const sx=((i*131-camX*0.15)%(W+20)+W+20)%(W+20)-10, sy=(i*47)%150+8;
    if((i+Math.floor(now()/500))%4!==0) px(sx,sy,1,1, i%7===0?'#fff':'#aeb8ff');
  }
  // 地平線グロー
  for(let i=0;i<26;i++) px(0,GROUND_Y-26+i,W,1,'rgba(120,80,160,'+(0.018*(26-i)).toFixed(3)+')');
  for(let i=0;i<16;i++){
    const bx=((i*210-camX*0.25)%(W+420)+W+420)%(W+420)-210, bh=50+(i*37)%70, by=GROUND_Y-bh;
    px(bx,by,90,bh,'#191c40'); px(bx,by,90,3,'#2a3160');
    for(let wy=by+8;wy<GROUND_Y-6;wy+=12) for(let wx=bx+8;wx<bx+82;wx+=14)
      px(wx,wy,5,6,((wx+wy)%3===0)?'#46579c':'#1f2450');
  }
  for(let i=0;i<11;i++){
    const bx=((i*300-camX*0.5)%(W+600)+W+600)%(W+600)-300, bh=80+(i*61)%80, by=GROUND_Y-bh;
    px(bx,by,140,bh,'#0d1030'); px(bx,by,140,3,'#1a2050');
    for(let wy=by+10;wy<GROUND_Y-8;wy+=16) for(let wx=bx+10;wx<bx+130;wx+=18)
      px(wx,wy,7,9,((wx*wy)%4===0)?'#ffcf6b':'#141838');

}
function tile(x,y,w,h){
  px(x,y,w,h,'#2a3358'); px(x,y,w,3,'#4a5a96'); px(x,y+3,w,2,'#39477a'); px(x,y+h-3,w,3,'#171c34');
  for(let tx=x;tx<x+w;tx+=16){ px(tx,y+5,1,h-8,'#202746'); px(tx+2,y+6,2,2,'#5a6aa8'); }
}
// 地形アート（solidsに重ねる・当たり判定は不変・無ければtile()）
const TERRAIN = {
  groundFill:{src:'assets/ground_fill.png'},      // シームレス地面本体(横タイル)
  groundTop :{src:'assets/ground_top.png', h:18}, // 地面の上縁(世界px高・横タイル)
  platform  :{src:'assets/platform.png'},         // 足場モジュール(横ストレッチ)
};
function _tileX(r, dx, dy, dw, dh){
  const iw=r.img.width, ih=r.img.height, sc=dh/ih, uw=Math.max(1,iw*sc);
  for(let t=0; t<dw; t+=uw){ const seg=Math.min(uw, dw-t);
    ctx.drawImage(r.img, 0,0, Math.max(1,iw*(seg/uw)), ih, Math.round(dx+t), Math.round(dy), Math.ceil(seg), Math.round(dh)); }
}
function drawTerrainSolid(s){
  if(!ctx) return false;
  const x=s.x-camX, ground=s.h>=40;
  if(ground){
    const f=TERRAIN.groundFill && getImg(TERRAIN.groundFill.src);
    if(f && f.ready && f.img){
      _tileX(f, x, s.y, s.w, s.h);
      const t=TERRAIN.groundTop && getImg(TERRAIN.groundTop.src);
      if(t && t.ready && t.img) _tileX(t, x, s.y, s.w, TERRAIN.groundTop.h||14);
      return true;
    }
  } else {
    const p=TERRAIN.platform && getImg(TERRAIN.platform.src);
    if(p && p.ready && p.img){ ctx.drawImage(p.img, 0,0,p.img.width,p.img.height, Math.round(x), Math.round(s.y), Math.round(s.w), Math.round(s.h)); return true; }
  }
  return false;
}
function drawSolids(){ for(const s of solids){ if(s.x+s.w<camX||s.x>camX+W)continue; if(!drawTerrainSolid(s)) tile(s.x-camX,s.y,s.w,s.h); } }

// ====== 骨格用 塗りパーツ(各パーツ上端中央=関節, 縦向き) ======
// bw/bh=描画ボックス(ワールドpx)。揃えば暫定コード描画に代わってdrawImageで描く。
const SKEL = {
  torso: {src:'assets/skel_torso.png', bw:18, bh:22.5},
  thigh: {src:'assets/skel_thigh.png', bw:9.6, bh:8.0},
  shin:  {src:'assets/skel_shin.png',  bw:8.6, bh:9.6},
  uarm:  {src:'assets/skel_uarm.png',  bw:6.6, bh:6.2},
  farm:  {src:'assets/skel_farm.png',  bw:7.4, bh:8.2},
  buster:{src:'assets/skel_buster.png',bw:9.6, bh:9.0},
};
function loadSkel(){
  if(typeof Image==='undefined') return;
  for(const k in SKEL){ const p=SKEL[k]; if(!p.src) continue;
    const im=new Image(); p.ready=false; p.settled=false;
    im.onload=()=>{p.ready=true;p.settled=true;}; im.onerror=()=>{p.settled=true;}; im.src=_av(p.src); p.img=im;
  }
}
function skelReady(){ return SKEL.torso.ready&&SKEL.thigh.ready&&SKEL.shin.ready&&SKEL.uarm.ready&&SKEL.farm.ready&&SKEL.buster.ready; }

// ====== 骨格(スケルタル)アニメ: パーツを関節で回して滑らかに動かす ======
// 角度は「真下=0, 前方(+x)を正」。ctx.rotate(-ang)で +ang→前方。先端を返す。
function _limb(x,y,ang,len,w,col,hi,part){
  ctx.save(); ctx.translate(x,y); ctx.rotate(-ang);
  if(part && part.ready && part.img){
    ctx.drawImage(part.img, 0,0,part.img.width,part.img.height, -part.bw/2, -part.bh*0.12, part.bw, part.bh);
  } else {
    ctx.fillStyle='#0a1230'; ctx.fillRect(-w/2-0.6, -w*0.55, w+1.2, len+w*0.7);   // アウトライン(関節側に重ねて隙間を消す)
    ctx.fillStyle=col; ctx.fillRect(-w/2, -w*0.35, w, len+w*0.5);
    if(hi){ ctx.fillStyle=hi; ctx.fillRect(-w/2, -w*0.35, Math.max(1,w*0.4), len+w*0.5); } // ハイライト
  }
  ctx.restore();
  return [x+Math.sin(ang)*len, y+Math.cos(ang)*len];
}
function drawSkelLeg(hx,hy,th,kn,TH,SH,col,hi,thP,shP){
  const k=_limb(hx,hy,th,TH,4.6,col,hi,thP);
  const sa=th-kn;
  const f=_limb(k[0],k[1],sa,SH,3.9,col,hi,shP);
  if(!shP){ ctx.save(); ctx.translate(f[0],f[1]); ctx.rotate(-sa);   // 足(コード時のみ。脛パーツは足を含む)
    ctx.fillStyle='#0a1230'; ctx.fillRect(-1.6,-0.4,5.2,3.2);
    ctx.fillStyle='#bfe6ff'; ctx.fillRect(-1.1,0.2,4.2,2.2); ctx.restore(); }
}
function drawSkelArm(sx,sy,sh,el,UA,FA,col,hi,buster,fire,charge,uaP,faP){
  const e=_limb(sx,sy,sh,UA,3.7,col,hi,uaP);
  const fa=sh+el;
  const h=_limb(e[0],e[1],fa,FA,buster?5.2:3.3,col,hi,faP);
  if(buster){
    const md=faP?(faP.bh*0.86):FA, mx=e[0]+Math.sin(fa)*md, my=e[1]+Math.cos(fa)*md;  // 砲口位置
    ctx.save(); ctx.translate(mx,my); ctx.rotate(-fa);
    if(!faP){ ctx.fillStyle='#0a1230'; ctx.fillRect(-3,-3,6.2,6.2); ctx.fillStyle='#5ad1ff'; ctx.fillRect(-2,-2,4,4); }
    if(charge){   // 蓄光オーブ=チャージ弾スプライト(塗り)。白い■にならないように
      const co=getImg(BULLET_SPR.charge.src), sz=(player.charge>=40?7.5:4.5+(player.charge/40)*3);
      if(co&&co.ready&&co.img){ const fw=co.img.width/(BULLET_SPR.charge.frames||1); ctx.drawImage(co.img,0,0,fw,co.img.height,-sz/2,-sz/2,sz,sz); }
      else { ctx.fillStyle='#9fe6ff'; ctx.fillRect(-sz/2+0.5,-sz/2+0.5,sz-1,sz-1); }
    }
    ctx.restore();   // 発射マズルはspawnFx('muzzle')に任せる(保持中は常時光らせない)
  }
}
function drawPlayerSkel(footX, footY, dir){
  const onG=player.onGround, mvg=Math.abs(player.vx)>0.1;
  const firing=player.fireHold>0, charging=player.charge>=8;
  const st = !onG ? 'jump' : mvg ? 'run' : 'idle';
  const ph = player.anim*0.85;
  const O='#0a1230', B='#2f6df0', BH='#7fb0ff', CY='#bfe6ff', WH='#fff', Bf='#274f93';
  let thN,thF,knN,knF,bob=0,lean=0;
  if(st==='run'){
    const A=0.88;
    thN=A*Math.sin(ph); thF=A*Math.sin(ph+Math.PI);
    knN=0.95*Math.max(0,Math.sin(ph-1.1))+0.15; knF=0.95*Math.max(0,Math.sin(ph+Math.PI-1.1))+0.15;
    bob=-Math.abs(Math.sin(ph))*1.0; lean=0.32;
  } else if(st==='jump'){
    const r=player.vy<0;
    thN=r?0.55:0.25; thF=r?-0.18:0.05; knN=r?0.95:0.45; knF=r?0.6:0.3; lean=0.18; bob=-0.6;
  } else { thN=0.08; thF=-0.08; knN=0.10; knF=0.10; bob=Math.sin(player.blink*0.05)*0.4; }
  let shN,elN,shF,elF;
  if(firing||charging){ shN=1.52; elN=0.0; }
  else if(st==='run'){ shN=0.6*Math.sin(ph+Math.PI)+0.30; elN=0.7; }
  else if(st==='jump'){ shN=0.85; elN=0.4; }
  else { shN=0.30; elN=0.6; }
  if(st==='run'){ shF=0.6*Math.sin(ph)+0.20; elF=0.7; }
  else if(st==='jump'){ shF=-0.25; elF=0.5; } else { shF=0.22; elF=0.6; }

  const TH=7, SH=8, UA=5, FA=7;
  const hipY=footY-14+bob, shoY=footY-25+bob, hipX=footX+lean*3, shoX=footX+lean*9;
  const SK=skelReady();
  ctx.save();
  if(dir<0){ ctx.translate(footX*2,0); ctx.scale(-1,1); }
  drawSkelLeg(hipX-1.2,hipY,thF,knF,TH,SH,Bf,null, SK?SKEL.thigh:null, SK?SKEL.shin:null);                 // 奥脚
  drawSkelArm(shoX-2,shoY,shF,elF,UA,FA,Bf,null,false,false,false, SK?SKEL.uarm:null, SK?SKEL.farm:null);  // 奥腕
  if(SK){
    const T=SKEL.torso; ctx.drawImage(T.img,0,0,T.img.width,T.img.height, shoX-T.bw/2, hipY+2-T.bh, T.bw, T.bh);  // 胴+頭+クレスト(塗り)
  } else {
    ctx.fillStyle=O; ctx.fillRect(hipX-5,shoY-1,11,hipY-shoY+6);
    ctx.fillStyle=B; ctx.fillRect(hipX-4,shoY,9,hipY-shoY+4);
    ctx.fillStyle=BH; ctx.fillRect(hipX-4,shoY,3,hipY-shoY+4);
    ctx.fillStyle=CY; ctx.fillRect(hipX-2,shoY+3,4,4);
    const hx=shoX+lean*2, hy=shoY-6;
    ctx.fillStyle=O; ctx.fillRect(hx-5,hy-3,11,11);
    ctx.fillStyle='#ffd1a0'; ctx.fillRect(hx-3,hy+1,8,6);
    ctx.fillStyle=B; ctx.fillRect(hx-5,hy-3,11,5); ctx.fillStyle=BH; ctx.fillRect(hx-5,hy-3,11,2);
    ctx.fillStyle=CY; ctx.fillRect(hx+2,hy+2,3,2);
    _limb(hx+3,hy-2,2.3,7,2.6,CY,WH);
  }
  drawSkelLeg(hipX+1.2,hipY,thN,knN,TH,SH,B,BH, SK?SKEL.thigh:null, SK?SKEL.shin:null);                    // 手前脚
  drawSkelArm(shoX+2,shoY,shN,elN,UA,FA,B,BH,true,firing,charging, SK?SKEL.uarm:null, SK?SKEL.buster:null); // 手前腕(バスター)
  ctx.restore();
}

function drawPlayer(){
  if(player.inv>0 && Math.floor(player.blink/3)%2===0 && !player.dead) return;
  if(player.dead){ return; }
  // 状態を脚と腕で独立に決める＝走り撃ち時は脚run+腕fireで“腕だけ伸ばしっぱなし”
  const onG=player.onGround, mvg=Math.abs(player.vx)>0.1, firing=player.fireHold>0;   // 発射保持中は腕を伸ばしたまま
  const legState = !onG ? 'jump' : mvg ? 'run' : (player.inv>56?'hurt':'idle');
  const armState = (player.charge>=8) ? 'charge' : firing ? 'fire' : 'down';
  const legFrame = legState==='run' ? Math.floor(player.anim) : 0;
  const armFrame = armState==='charge' ? Math.floor(player.blink/4) : 0;
  const footX = player.x-camX+player.w/2, footY = player.y+player.h;
  // 静止(立ち/立ち撃ち/チャージ/ジャンプは射撃以外)は元の主人公1枚絵=デザイン・ポーズ完全一致。
  // 走り(脚を動かす)は骨格で滑らかに。これで「よく見る立ち姿=元の主人公」「走り=正しい動き」を両立。
  const _standing = player.onGround && Math.abs(player.vx)<=0.1;
  if(_standing){
    const _anim = (player.inv>56)?'hurt' : (armState==='fire')?'shoot' : (armState==='charge')?'charge' : 'idle';
    // 射撃は「構え」ポーズで固定(保持中はマズルでチラつかせない=発射FXに任せる)。連射しても都度ポーズが変わらない
    const _fr = (_anim==='shoot') ? 0 : null;
    if(drawSheet('player', _anim, player.blink, footX, footY, player.dir, _fr)) return;
  }
  // 走り/ジャンプ(=動きのある状態)は骨格アニメ
  drawPlayerSkel(footX, footY, player.dir);
  return;
  // ===== 以下は旧コード描画リグ(未使用) =====
  const x=Math.round(player.x-camX), y=Math.round(player.y), d=player.dir;
  ctx.save();
  if(d<0){ctx.translate(x+player.w,y);ctx.scale(-1,1);} else ctx.translate(x,y);
  // ===== パレット =====
  const O='#0a1024', B='#2f6df0', BL='#173c88', BH='#6aa6ff', CY='#bfe6ff',
        SK='#ffd1a0', SKL='#ffe6c8', EY='#12204e', WH='#ffffff';
  const bob = (legState==='idle') ? Math.floor(player.blink/26)%2 : 0;   // 待機の呼吸
  const blink = (legState==='idle' && Math.floor(player.blink/70)%9===0);
  // ===== 脚（legStateで独立アニメ）=====
  if(legState==='run'){
    if(legFrame%2===0){
      px(1,17,15,9,O); px(2,18,4,5,BL); px(11,18,4,4,BL); px(2,18,4,2,B); px(11,18,4,2,B);
      px(1,23,6,2,CY); px(12,22,5,2,CY);
    }else{
      px(3,17,15,9,O); px(4,18,4,4,BL); px(10,18,4,5,BL); px(4,18,4,2,B); px(10,18,4,2,B);
      px(4,22,5,2,CY); px(11,23,6,2,CY);
    }
  }else if(legState==='jump'){
    px(3,16,13,10,O); px(4,17,4,6,BL); px(9,17,4,6,BL); px(4,17,4,2,B); px(9,17,4,2,B);
    px(4,22,5,2,CY); px(9,22,5,2,CY);
  }else{   // idle / hurt
    px(2,17,15,9,O); px(3,18,4,5,BL); px(10,18,4,5,BL); px(3,18,4,2,B); px(10,18,4,2,B);
    px(2,23,6,2,CY); px(10,23,6,2,CY);
  }
  // ===== 胴（bobで1px上下）=====
  const by=10+bob;
  px(3,by-1,13,11,O); px(4,by,11,9,B); px(4,by,11,3,BH); px(4,by+7,11,2,BL); px(4,by,2,9,BH);
  px(7,by+2,5,5,CY); px(8,by+3,3,3,WH);
  // ===== 腕・バスター（armStateで独立）=====
  const ay=by+2;
  if(armState==='charge'){
    const cc=player.charge>=40?(Math.floor(player.blink/2)%2?'#eafcff':'#9fe6ff'):'#7fc4ff';
    px(14,ay-1,12,9,O); px(15,ay,9,7,cc); px(24,ay+1,2,5,cc); px(16,ay+1,5,2,WH);
  }else if(armState==='fire'){
    // 前方へ伸ばした射撃腕（走り撃ち中も維持＝動かすのは腕のみ）
    px(14,ay-1,16,8,O); px(15,ay,13,6,B); px(15,ay,13,2,BH); px(15,ay+4,13,2,BL);
    px(27,ay,4,6,'#0e2a66'); px(28,ay+1,3,4,CY); px(29,ay+2,2,2,WH);
  }else{
    px(14,ay-1,11,8,O); px(15,ay,8,6,B); px(15,ay,8,2,BH); px(15,ay+4,8,2,BL);
    px(22,ay+1,3,4,'#0e2a66'); px(23,ay+2,2,2,'#3a6ad0');
  }
  // ===== 顔 =====
  const hy=bob;
  px(4,hy+3,11,8,O); px(5,hy+4,9,6,SK); px(5,hy+4,9,2,SKL);
  if(blink){ px(8,hy+6,2,1,EY); px(11,hy+6,2,1,EY); }
  else{ px(8,hy+5,2,3,EY); px(11,hy+5,2,3,EY); px(11,hy+5,1,1,'#9fb8ff'); }
  // ===== ヘルメット =====
  px(3,hy-1,13,6,O); px(4,hy,11,4,B); px(4,hy,11,2,BH);
  px(4,hy+3,2,3,BL); px(13,hy+3,2,4,BL); px(13,hy,3,3,CY);
  px(6,hy-2,6,2,BH); px(7,hy-3,4,1,CY);
  ctx.restore();
}

function drawEnemy(e){
  const x=Math.round(e.x-camX), y=Math.round(e.y);
  const f=e.hit>0 && Math.floor(e.hit/2)%2===0;
  if(!e.alive){ const t=e.deathT,r=t*2.2; for(let i=0;i<6;i++){const a=i*Math.PI/3+t*0.3; px(x+10+Math.cos(a)*r,y+9+Math.sin(a)*r,3,3,t<6?'#fff':'#ffd23f');} return; }
  // 高精細スプライト優先（種別ごとにassets設定があれば）
  const _en = e.type==='flyer'?'fly' : e.type==='met'?(e.phase==='open'?'open':'hide') : e.type==='walker'?'walk' : e.type==='turret'?((e.timer||99)<16?'fire':'idle') : 'idle';
  if(drawSheet(e.type, _en, e.t, e.x-camX+e.w/2, e.y+e.h, (e.dir||(sign(player.x-e.x)||1)))) return;
  const O='#1a0a22', Ob='#06121f';
  if(e.type==='met'){
    px(x,y+5,20,13,O); px(x+4,y+1,12,5,O);                       // アウトライン
    if(e.phase==='open'){ px(x+4,y+3,12,3,'#e8c0c0'); px(x+6,y+3,2,2,'#ff3b3b'); px(x+11,y+3,2,2,'#ff3b3b'); }
    px(x+1,y+6,18,11,f?'#fff':'#ffb43f'); px(x+1,y+6,18,3,f?'#fff':'#ffe07f'); px(x+1,y+15,18,2,'#c97400');
    px(x+5,y+2,10,5,f?'#fff':'#ffd23f');
    px(x+7,y+9,5,5,'#9c4a00'); px(x+9,y+7,2,9,'#9c4a00');        // 顔の十字
  }else if(e.type==='walker'){
    px(x+1,y+3,20,16,O); px(x+7,y,2,4,O);                        // アウトライン+アンテナ
    px(x+2,y+4,18,14,f?'#fff':'#a23ab0'); px(x+2,y+4,18,3,'#d97fe0'); px(x+2,y+15,18,3,'#6e1f7a');
    px(x+4,y+7,5,5,'#fff'); px(x+11,y+7,5,5,'#fff'); px(x+6,y+8,2,3,'#2a0033'); px(x+13,y+8,2,3,'#2a0033'); // 目
    px(x+3,y+18,5,4,'#3a0f44'); px(x+13,y+18,5,4,'#3a0f44');     // 脚
    px(x+8,y+1,2,3,'#d97fe0');
  }else if(e.type==='flyer'){
    const wf=Math.floor(e.t/6)%2; const wy=wf?2:5;
    px(x-4,y+wy-1,7,5,Ob); px(x+15,y+wy-1,7,5,Ob); px(x+2,y+3,16,12,Ob); // アウトライン
    px(x-3,y+wy,6,3,'#bdf0ff'); px(x+17,y+wy,6,3,'#bdf0ff');     // 翼
    px(x+3,y+4,14,10,f?'#fff':'#2f9fd8'); px(x+3,y+4,14,3,'#9fe8ff'); px(x+3,y+12,14,2,'#1d6e9c');
    px(x+5,y+7,3,3,'#ff3b3b'); px(x+12,y+7,3,3,'#ff3b3b'); px(x+5,y+7,1,1,'#fff'); px(x+12,y+7,1,1,'#fff');
  }else if(e.type==='turret'){
    px(x+1,y+9,22,18,Ob); px(x+5,y+1,14,11,Ob);                  // アウトライン
    px(x+2,y+10,20,16,f?'#fff':'#5a6488'); px(x+2,y+10,20,3,'#8a96bc'); px(x+2,y+23,20,3,'#2e3550');
    px(x+6,y+2,12,10,f?'#fff':'#39507a'); px(x+6,y+2,12,2,'#5a78aa');
    const d=sign(player.x-e.x)||-1; px(x+(d>0?15:2),y+5,9,4,'#161c30'); px(x+9,y+14,6,4,'#ff5a4a'); px(x+10,y+15,4,2,'#ffd0c0');
  }
}

function drawBoss(){
  if(!boss)return;
  const x=Math.round(boss.x-camX), y=Math.round(boss.y), d=boss.dir;
  const f=boss.hit>0 && Math.floor(boss.hit/2)%2===0;
  if(boss.dead){
    if(drawSheet('boss','death', boss.deadT, boss.x-camX+boss.w/2, boss.y+boss.h, boss.dir)) return;
    return;
  }
  // 武器の状態（専用キャノン）：溜め→発射で腕(キャノン)のみ動かす
  const bArm = boss.state==='shoot' ? (boss.timer<18?'charge':'fire') : 'idle';
  // ① パーツ分割リグ（本体+専用キャノン）が揃えば優先
  if(drawBossRig(bArm, boss.x-camX+boss.w/2, boss.y+boss.h, boss.dir, boss.timer)) return;
  // ② 高精細フルフレーム → ③ コード描画
  const _bs = boss.state==='shoot'?'shoot' : boss.state==='dash'?'dash' : boss.state==='jump'?'jump' : 'idle';
  if(drawSheet('boss', _bs, boss.timer, boss.x-camX+boss.w/2, boss.y+boss.h, boss.dir)) return;
  ctx.save();
  if(d<0){ctx.translate(x+boss.w,y);ctx.scale(-1,1);} else ctx.translate(x,y);
  const C=f?'#fff':'#d63a2a', C2=f?'#fff':'#a01f12', HL=f?'#fff':'#ff7a5a', O='#2a0603';
  // --- アウトライン ---
  px(3,37,12,9,O); px(21,37,12,9,O); px(4,15,30,26,O); px(8,1,22,17,O); px(27,17,12,14,O); px(-1,19,9,12,O);
  px(10,-1,5,4,O); px(22,-1,5,4,O);
  // --- 脚 ---
  px(4,38,9,8,C2); px(22,38,9,8,C2); px(4,44,11,2,'#3a0a05'); px(20,44,11,2,'#3a0a05');
  // --- 胴 ---
  px(5,16,28,24,C); px(5,16,28,4,HL); px(5,34,28,4,C2);
  px(11,21,16,12,'#3a0a05'); px(12,22,14,10,'#ffd23f'); px(15,24,8,6,'#ff7a00'); px(13,23,3,3,'#ffe88a'); // 胸コア
  // --- 腕／専用キャノン（bArmで独立：構え/溜め/発射）---
  px(0,20,7,10,C2);   // 反対側の小腕
  if(bArm==='fire'){
    px(28,16,17,14,C2); px(28,16,17,3,HL); px(44,18,5,10,'#222'); px(45,20,5,6,'#ffd23f'); px(49,21,3,4,'#fff'); // 砲身伸長+マズル
  }else if(bArm==='charge'){
    px(28,18,11,12,C2); px(28,18,11,3,HL); px(37,19,6,9,'#3a0a05'); px(39,21,3,5,Math.floor(boss.timer/3)%2?'#ffe88a':'#ff7a00'); // 溜めコア
  }else{
    px(28,18,10,12,C2); px(28,18,10,3,HL); px(36,20,5,8,'#222');
  }
  // --- 頭 ---
  px(9,2,20,15,C); px(9,2,20,4,HL); px(13,7,5,5,'#fff'); px(20,7,5,5,'#fff'); px(14,8,3,3,'#ff1a1a'); px(21,8,3,3,'#ff1a1a');
  px(11,0,4,4,'#ffd23f'); px(23,0,4,4,'#ffd23f'); px(15,13,8,2,'#3a0a05');
  ctx.restore();
}

function drawBullets(){
  for(const b of pBullets){
    if(drawBulletSpr(b.charge?BULLET_SPR.charge:BULLET_SPR.buster, b)) continue;
    const x=b.x-camX;
    if(b.charge){ px(x,b.y,b.w,b.h,'#bff0ff'); px(x+2,b.y+2,b.w-4,b.h-4,'#5ad1ff'); px(x+4,b.y+4,b.w-8,b.h-8,'#fff'); }
    else{ px(x,b.y,b.w,b.h,'#aef0ff'); px(x+1,b.y+1,b.w-2,b.h-2,'#7fd8ff'); }
  }
  for(const b of eBullets){
    if(drawBulletSpr(BULLET_SPR.enemy, b)) continue;
    px(b.x-camX,b.y,b.w,b.h,b.c); px(b.x-camX+1,b.y+1,b.w-2,b.h-2,'#fff');
  }
}
function drawFx(){ for(const p of fx){ px(p.x-camX,p.y,3,3,p.life>8?'#fff':p.col); } }

// HPバー画像（枠＋内側fill。無ければ下のコードゲージ）。fill領域は素材に合わせ調整。
const UI_SPR = {
  // 表示90px = 素材360pxを0.25倍。内側透過チャンネルもその比で算出。
  hp  :{src:'assets/ui_hp.png',      x:10,    y:8, w:90, h:18, fill:{x:10,y:6,w:69,h:7}},
  boss:{src:'assets/ui_hp_boss.png', x:W-100, y:8, w:90, h:15, fill:{x:11,y:4,w:67,h:7}, rtl:true},
};
function hpBarImg(cfg, frac){
  const r=getImg(cfg.src); if(!r||!r.ready||!r.img||!ctx) return false;
  const f=cfg.fill; px(cfg.x+f.x, cfg.y+f.y, f.w, f.h, '#0e1530');         // 下地
  const fw=Math.max(0,Math.round(f.w*clamp(frac,0,1)));
  const ox=cfg.rtl ? cfg.x+f.x+f.w-fw : cfg.x+f.x;
  for(let i=0;i<fw;i++){ const t=(cfg.rtl?(f.w-1-i):i)/Math.max(1,f.w-1);
    ctx.fillStyle = cfg.boss ? (t<0.5?'#ff7a00':'#ffd23f') : (t<0.25?'#ff5a4a':t<0.5?'#ffd23f':'#5ad1ff');
    ctx.fillRect((cfg.rtl?cfg.x+f.x+f.w-1-i:ox+i)|0, (cfg.y+f.y)|0, 1, f.h); }
  ctx.drawImage(r.img,0,0,r.img.width,r.img.height, cfg.x,cfg.y,cfg.w,cfg.h);  // 枠を上に
  return true;
}
function hpGauge(){
  px(8,8,12,player.maxhp*2+8,'#0a0e1a'); px(9,9,10,player.maxhp*2+6,'#16203c');
  for(let i=0;i<player.maxhp;i++){ const yy=10+(player.maxhp-1-i)*2; px(10,yy,8,2, i<player.hp?(i<4?'#ff5a4a':'#5ad1ff'):'#0e1530'); }
  px(8,4,12,3,'#ffd23f');
}
function bossGauge(){
  const bx=W-20, H0=52;                       // 固定高さの比例ゲージ(maxhpを増やしても潰れない)
  px(bx,8,12,H0+8,'#0a0e1a'); px(bx+1,9,10,H0+6,'#16203c');
  const fh=Math.round(H0*clamp(boss.hp/boss.maxhp,0,1));
  px(bx+2,10+(H0-fh),8,fh,'#ff7a00'); px(bx+2,10+(H0-fh),8,Math.min(fh,3),'#ffd23f');
  px(bx,4,12,3,'#ff3b3b');
}
function drawHUD(){
  if(!(UI_SPR.hp && hpBarImg(UI_SPR.hp, player.hp/player.maxhp))) hpGauge();
  if(bossActive && boss && !boss.dead){
    if(!(UI_SPR.boss && hpBarImg(Object.assign({boss:true},UI_SPR.boss), boss.hp/boss.maxhp))) bossGauge();
  }
}
function drawGate(){
  if(gate && boss && !boss.dead){
    const gx=ROOM_X+2-camX;
    if(gx>-20 && gx<W){ px(gx,30,14,GROUND_Y-30,'#444c6e'); for(let yy=30;yy<GROUND_Y;yy+=16){px(gx,yy,14,3,'#22273f');px(gx+2,yy+5,10,6,'#5a6488');} }
  }
}

function text(s,x,y,sz,c,al='center'){ if(!ctx)return; ctx.fillStyle=c; ctx.font='bold '+sz+'px "Courier New",monospace'; ctx.textAlign=al; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }

function drawTitle(){
  bg(); const t=now()/300;
  text('COBALT',W/2,86,42,'#0a0e1a'); if(ctx){ctx.fillStyle='#5ad1ff';ctx.fillText('COBALT',W/2-2,84);}
  text('BOLT',W/2,126,42,'#0a0e1a'); if(ctx){ctx.fillStyle='#ffd23f';ctx.fillText('BOLT',W/2-2,124);}
  text('- 横スクロールアクション -',W/2,150,11,'#aeb8ff');
  if(Math.floor(t)%2===0) text('PRESS  ENTER',W/2,196,18,'#fff');
  text('← → 移動   Z ジャンプ   X ショット(長押しチャージ)',W/2,236,10,'#7a86b0');
}
function drawDead(){ if(!ctx)return; ctx.fillStyle='rgba(5,6,12,.78)'; ctx.fillRect(0,0,W,H); text('GAME OVER',W/2,120,38,'#ff3b3b'); text('PRESS ENTER TO RETRY',W/2,158,14,'#fff'); }
function drawLoading(){
  if(!ctx)return;
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0a0e2c'); g.addColorStop(1,'#231a4a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  text('COBALT',W/2,H/2-26,30,'#5ad1ff'); text('BOLT',W/2,H/2+2,30,'#ffd23f');
  const p=preloadProgress(), bw=160, bx=(W-bw)/2, by=H/2+24;
  px(bx-2,by-2,bw+4,10,'#0a0e1a'); px(bx,by,Math.max(2,Math.round(bw*p)),6,'#5ad1ff');
  text('LOADING '+Math.round(p*100)+'%',W/2,by+26,11,'#aeb8ff');
}
function drawClear(){
  bg(); if(ctx){ctx.fillStyle='rgba(5,6,20,.5)';ctx.fillRect(0,0,W,H);}
  text('STAGE CLEAR!',W/2,110,36,'#0a0e1a'); if(ctx){ctx.fillStyle='#ffd23f';ctx.textAlign='center';ctx.fillText('STAGE CLEAR!',W/2-2,108);}
  text('ボスを撃破した！',W/2,142,14,'#fff');
  if(Math.floor(now()/400)%2===0) text('PRESS ENTER',W/2,184,16,'#aef0ff');
  for(let i=0;i<30;i++){ const cx=(i*61+now()*0.05*((i%2)?1:-1))%W, cy=(i*40+now()*0.08)%H; px(cx,cy,3,3,['#ff5a4a','#5ad1ff','#ffd23f','#7fff9f'][i%4]); }
}

function render(){
  if(!ctx)return;
  if(ctx.setTransform)ctx.setTransform(RS,0,0,RS,0,0);   // ワールド→1920x1080(4倍)基準変換
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*0.4,rnd(-shake,shake)*0.4);
  if(state==='loading'){ drawLoading(); ctx.restore(); return; }
  if(state==='title'){ drawTitle(); ctx.restore(); return; }
  if(state==='clear'){ drawClear(); ctx.restore(); return; }
  bg(); drawSolids(); drawHazards(); drawGate(); drawItems();
  for(const e of enemies) drawEnemy(e);
  drawBoss(); drawBullets(); drawPlayer(); drawFx(); drawEffects(); drawHUD();
  if(warnT>0 && boss) text('WARNING!',W/2,60,22,(Math.floor(warnT/6)%2?'#ff3b3b':'#fff'));
  if(state==='dead') drawDead();
  ctx.restore();
}

//======================================================================
//  ループ
//======================================================================
function frame(){ update(); render(); for(const k in PRESS)PRESS[k]=false; }
function loop(){ frame(); requestAnimationFrame(loop); }
loadAssets(); preloadAll();
if(!HEADLESS && typeof requestAnimationFrame!=='undefined') loop();

//======================================================================
//  テスト用フック（ヘッドレス検証用）
//======================================================================
if(typeof globalThis!=='undefined'){
  globalThis.__GAME={
    get state(){return state}, get player(){return player}, get enemies(){return enemies},
    get boss(){return boss}, get bossActive(){return bossActive},
    get pBullets(){return pBullets}, get eBullets(){return eBullets},
    get camX(){return camX}, get solids(){return solids}, get items(){return items}, get hazards(){return hazards}, get spawns(){return spawns},
    consts:{W,H,GROUND_Y,LEVEL_W,ROOM_X,BOSS_TRIGGER,PW,PH},
    start:startGame,
    draw(){ render(); },                                          // 現在状態を描画（スクショ検証用）
    assets:ASSETS, loadAssets,                                    // スプライト検証用
    set state(v){ state=v; },                                     // テスト用に画面状態を直接指定
    step(){ update(); for(const k in PRESS)PRESS[k]=false; },     // 1フレーム進める（描画なし）
    hold(k){ if(!keys[k])PRESS[k]=true; keys[k]=true; },
    release(k){ keys[k]=false; },
    releaseAll(){ for(const k in keys)keys[k]=false; for(const k in PRESS)PRESS[k]=false; },
  };
}

})();
</script>

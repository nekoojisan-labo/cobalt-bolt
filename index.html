<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COBALT BOLT - 横スクロールアクション</title>
<style>
  html,body{margin:0;height:100%;background:#05060c;overflow:hidden;
    font-family:'Segoe UI','Yu Gothic UI',sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:auto;
    box-shadow:0 0 0 3px #0a0e1a,0 0 40px rgba(60,120,255,.35);background:#000;}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;color:#5a6680;
    font-size:12px;letter-spacing:1px;user-select:none;}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1920" height="1080"></canvas></div>
<div id="hint">← → 移動 ／ Z ジャンプ ／ X ショット（長押しでチャージ） ／ Enter 決定・リスタート</div>
<script>
//======================================================================
//  COBALT BOLT  -  retro-style single-stage side-scrolling action game
//  Pure Canvas, no assets.  Logic is decoupled from rendering so it can
//  be run head-less for automated testing (see __GAME hook at the end).
//======================================================================
(()=>{
"use strict";
const HEADLESS = typeof globalThis!=='undefined' && globalThis.__HEADLESS;

// ---------- 解像度 ----------
// W,H = ワールド座標（物理・当たり判定の基準・不変）。実描画は RS 倍の 1920x1080。
const W=480, H=270, RS=4, VW=W*RS, VH=H*RS;
const canvas = (typeof document!=='undefined') ? document.getElementById('game') : {width:VW,height:VH,style:{},getContext:()=>null};
const ctx = canvas.getContext ? canvas.getContext('2d') : null;
if(ctx){ canvas.width=VW; canvas.height=VH; ctx.imageSmoothingEnabled=true; }

function fit(){
  if(HEADLESS || !ctx) return;
  canvas.width=VW; canvas.height=VH;                       // バックストアは常に 1920x1080
  const s=Math.min(innerWidth/VW, innerHeight/VH);         // ウィンドウにフィット（スムーズ拡縮）
  canvas.style.width=Math.round(VW*s)+'px'; canvas.style.height=Math.round(VH*s)+'px';
  ctx.imageSmoothingEnabled=true;
}
if(!HEADLESS && typeof window!=='undefined'){ addEventListener('resize',fit); fit(); }

// ---------- 入力 ----------
const keys={}, PRESS={};
if(!HEADLESS && typeof window!=='undefined'){
  addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();
    if(!keys[k])PRESS[k]=true;
    keys[k]=true;
  });
  addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
}
const KL='arrowleft',KR='arrowright',KJUMP='z',KSHOOT='x',KENTER='enter';

// ---------- util ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sign =v=>v<0?-1:v>0?1:0;
const rnd  =(a,b)=>a+Math.random()*(b-a);
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function px(x,y,w,h,c){ if(!ctx)return; ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),w,h); }

// ---------- 簡易SE（WebAudio・任意） ----------
let actx=null;
function sfx(type){
  if(HEADLESS) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.connect(g); g.connect(actx.destination);
    const t=actx.currentTime;
    if(type==='shoot'){o.type='square';o.frequency.setValueAtTime(660,t);o.frequency.exponentialRampToValueAtTime(180,t+.12);g.gain.setValueAtTime(.06,t);}
    else if(type==='charge'){o.type='sawtooth';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(880,t+.18);g.gain.setValueAtTime(.07,t);}
    else if(type==='hit'){o.type='square';o.frequency.setValueAtTime(140,t);g.gain.setValueAtTime(.08,t);}
    else if(type==='boom'){o.type='triangle';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.3);g.gain.setValueAtTime(.12,t);}
    else if(type==='hurt'){o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(60,t+.25);g.gain.setValueAtTime(.1,t);}
    g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.start(t); o.stop(t+.32);
  }catch(e){}
}

//======================================================================
//  高精細スプライト・エンジン（任意）
//  assets/ にPNGスプライトシートを置き、下のASSETSを設定すると有効化。
//  画像が無い／未ロードのときは自動で従来のコード描画にフォールバックする。
//======================================================================
// 各エンティティ＝{fw,fh,scale,ax,ay, anims:{name:{src,frames,fps}}}。
// anim毎に1枚の横ストリップPNG（コマを横一列）。素材配置後にここを記述する。
const ASSETS = {
  // 高精細2D(塗り)。scale/ayは見た目に合わせて調整。未生成のanimはidleへ自動フォールバック。
  player:{ fw:256, fh:256, scale:0.16, ax:0.5, ay:0.98, anims:{
    idle  :{src:'assets/player_idle.png',  frames:5, fps:6},
    run   :{src:'assets/player_run.png',   frames:8, fps:14},
    jump  :{src:'assets/player_jump.png',  frames:2, fps:6},
    shoot :{src:'assets/player_shoot.png', frames:2, fps:14},
    charge:{src:'assets/player_charge.png',frames:4, fps:12},
    hurt  :{src:'assets/player_hurt.png',  frames:2, fps:10},
  }},
  met:{ fw:128, fh:128, scale:0.22, ax:0.5, ay:1, anims:{
    hide:{src:'assets/enemy_met_hide.png', frames:1, fps:1},
    open:{src:'assets/enemy_met_open.png', frames:3, fps:8},
    idle:{src:'assets/enemy_met_hide.png', frames:1, fps:1},
  }},
  walker:{ fw:128, fh:128, scale:0.22, ax:0.5, ay:1, anims:{
    walk:{src:'assets/enemy_walker.png', frames:4, fps:8},
    idle:{src:'assets/enemy_walker.png', frames:4, fps:8},
  }},
  flyer:{ fw:128, fh:128, scale:0.2, ax:0.5, ay:1, anims:{
    fly :{src:'assets/enemy_flyer.png', frames:4, fps:12},
    idle:{src:'assets/enemy_flyer.png', frames:4, fps:12},
  }},
  turret:{ fw:128, fh:128, scale:0.26, ax:0.5, ay:1, anims:{
    idle:{src:'assets/enemy_turret.png',      frames:1, fps:1},
    fire:{src:'assets/enemy_turret_fire.png', frames:2, fps:12},
  }},
  boss:{ fw:512, fh:512, scale:0.13, ax:0.5, ay:1, anims:{
    idle :{src:'assets/boss_idle.png',  frames:2, fps:4},
    jump :{src:'assets/boss_jump.png',  frames:2, fps:6},
    shoot:{src:'assets/boss_shoot.png', frames:3, fps:10},
    dash :{src:'assets/boss_dash.png',  frames:2, fps:10},
    death:{src:'assets/boss_death.png', frames:4, fps:6},
  }},
};
function loadAssets(){
  if(typeof Image==='undefined') return;   // ブラウザ/検証環境でImageがあるときのみ
  for(const k in ASSETS){ const a=ASSETS[k];
    for(const name in (a.anims||{})){ const an=a.anims[name]; if(!an.src) continue;
      const im=new Image(); an.ready=false; im.onload=()=>{an.ready=true;}; im.onerror=()=>{an.ready=false;}; im.src=an.src; an.img=im;
    }
  }
}
// 足元(底辺中央)のスクリーン座標 footX/footY に、anim の現在コマを描く。dir<0で反転。
function drawSheet(key, anim, time, footX, footY, dir){
  const a=ASSETS[key]; if(!a || !ctx) return false;
  let an=a.anims[anim]; if(!an || !an.ready) an=a.anims.idle;   // 無ければidleで代用
  if(!an || !an.ready || !an.img) return false;
  const fw=a.fw, fh=a.fh, sc=a.scale||1, w=fw*sc, h=fh*sc, n=an.frames||1;
  const f=(an.fps ? Math.floor(time*an.fps/60)%n : 0);
  const sxp=f*fw, syp=0;
  const dx=Math.round(footX - w*(a.ax!=null?a.ax:0.5)), dy=Math.round(footY - h*(a.ay!=null?a.ay:1));
  ctx.save();
  if(dir<0){ ctx.translate(dx+w,0); ctx.scale(-1,1); ctx.drawImage(an.img, sxp,syp,fw,fh, 0,dy, w,h); }
  else ctx.drawImage(an.img, sxp,syp,fw,fh, dx,dy, w,h);
  ctx.restore();
  return true;
}

// ---- 弾・汎用画像（assets配置で有効・無ければ図形描画にフォールバック）----
const BULLET_SPR = {
  buster:{src:'assets/bullet_buster.png', size:18, frames:2, fps:16},
  charge:{src:'assets/bullet_charge.png', size:30, frames:2, fps:12},
  enemy :{src:'assets/bullet_enemy.png',  size:15, frames:2, fps:14},
};
const _imgreg={};
function getImg(src){
  if(!src) return null;
  if(_imgreg[src]) return _imgreg[src];
  const o={ready:false,img:null}; _imgreg[src]=o;
  if(typeof Image!=='undefined'){ const im=new Image(); im.onload=()=>{o.ready=true;}; im.onerror=()=>{o.ready=false;}; im.src=src; o.img=im; }
  return o;
}
// 弾の中心(b.x+b.w/2, b.y+b.h/2)にスプライトを描く。vx<0で水平反転。
function drawBulletSpr(cfg,b){
  if(!cfg||!cfg.src||!ctx) return false;
  const r=getImg(cfg.src); if(!r||!r.ready||!r.img) return false;
  const s=cfg.size||14, n=cfg.frames||1, iw=r.img.width, ih=r.img.height, fw=iw/n;
  const f=cfg.fps?Math.floor((b.life||0)*cfg.fps/60)%n:0;   // life基準でアニメ
  const cx=Math.round(b.x-camX+b.w/2), cy=Math.round(b.y+b.h/2);
  ctx.save();
  if(b.vx<0){ ctx.translate(cx+ s/2,0); ctx.scale(-1,1); ctx.drawImage(r.img, f*fw,0,fw,ih, 0,cy-s/2, s,s); }
  else ctx.drawImage(r.img, f*fw,0,fw,ih, cx-s/2,cy-s/2, s,s);
  ctx.restore();
  return true;
}

//======================================================================
//  STAGE
//======================================================================
const GROUND_Y=216;
const LEVEL_W=4200;
const ROOM_X=3720;          // ボス部屋の左端（カメラ固定位置）
const BOSS_TRIGGER=3780;    // ここを越えるとボス出現
let camX=0;

const solids=[];
const S=(x,y,w,h)=>solids.push({x,y,w,h});
const GY=GROUND_Y;
// --- 地面（穴5つ・各70px＝ジャンプ可）---
S(0,    GY, 620, 54);          // 穴 620-690
S(690,  GY, 540, 54);          // 穴 1230-1300
S(1300, GY, 640, 54);          // 穴 1940-2010
S(2010, GY, 560, 54);          // 穴 2570-2640
S(2640, GY, 620, 54);          // 穴 3260-3330
S(3330, GY, LEVEL_W-3330, 54); // ボス部屋まで連続
// --- 足場（穴の上＋高所ルート：変化を出す）---
S(560,168,100,14);  S(420,124,80,14);                 // 導入＋高所
S(840,176,90,14);   S(1040,150,90,14);
S(1170,168,100,14); S(1450,150,90,14);  S(1620,182,90,14);
S(1800,146,90,14);  S(1880,170,100,14);               // 高所＋穴上
S(2160,176,90,14);  S(2340,144,90,14);                // 高所(アイテム/砲台)
S(2520,168,100,14); S(2780,150,90,14);  S(2960,182,90,14);
S(3140,150,90,14);  S(3260,170,100,14);
S(3480,176,90,14);  S(3600,150,90,14);
// --- 段差（階段）---
S(3000,200,60,16); S(3060,184,60,32);
// --- ハザード（接触で小ダメージ・足場や穴で回避）---
const hazards=[
  {x:1490,y:GY-6,w:120,h:6},   // スパイク帯1（上の足場1450で回避）
  {x:2870,y:GY-6,w:130,h:6},   // スパイク帯2
];

//======================================================================
//  弾
//======================================================================
const pBullets=[], eBullets=[];
function shootP(x,y,dir,charge){
  pBullets.push({x,y,w:charge?13:8,h:charge?13:5,vx:dir*(charge?6.5:8),dmg:charge?3:1,charge,life:90});
  sfx(charge?'charge':'shoot');
}
function shootE(x,y,vx,vy,c='#ff5a4a'){ eBullets.push({x,y,w:7,h:7,vx,vy,c,life:300}); }

//======================================================================
//  プレイヤー
//======================================================================
const PW=18, PH=24;
const player={x:80,y:GROUND_Y-PH,w:PW,h:PH,vx:0,vy:0,dir:1,onGround:false,
  hp:16,maxhp:16,inv:0,shootCD:0,charge:0,wasShoot:false,
  dead:false,deadT:0,coyote:0,jumpBuf:0,anim:0,blink:0};
function resetPlayer(){
  Object.assign(player,{x:80,y:GROUND_Y-PH,vx:0,vy:0,dir:1,onGround:false,
    hp:16,maxhp:16,inv:0,shootCD:0,charge:0,wasShoot:false,
    dead:false,deadT:0,coyote:0,jumpBuf:0,anim:0,blink:0});
}

const GRAV=0.5, MOVE=2.3, JUMP=-8.6, TERM=9;

function collideX(o){
  o.x+=o.vx;
  if(o.vx===0) return;                 // 移動していなければ横解決しない（埋まり時の誤ワープ防止）
  for(const s of solids) if(aabb(o,s)){ o.x = o.vx>0 ? s.x-o.w : s.x+s.w; o.vx=0; }
}
function collideY(o){
  o.y+=o.vy; o.onGround=false;
  for(const s of solids) if(aabb(o,s)){
    if(o.vy>0){o.y=s.y-o.h;o.onGround=true;} else if(o.vy<0)o.y=s.y+s.h;
    o.vy=0;
  }
}

function updatePlayer(){
  if(player.dead){player.deadT++;return;}
  // 横
  let mv=0;
  if(keys[KL]){mv=-1;player.dir=-1;}
  if(keys[KR]){mv= 1;player.dir= 1;}
  player.vx=mv*MOVE;
  // コヨーテ＆ジャンプバッファ
  if(player.onGround)player.coyote=6; else if(player.coyote>0)player.coyote--;
  if(PRESS[KJUMP])player.jumpBuf=6; else if(player.jumpBuf>0)player.jumpBuf--;
  if(player.jumpBuf>0 && player.coyote>0){
    player.vy=JUMP; player.jumpBuf=0; player.coyote=0; player.onGround=false; sfx('shoot');
  }
  if(!keys[KJUMP] && player.vy<-3) player.vy=-3; // 可変ジャンプ
  player.vy=clamp(player.vy+GRAV,-20,TERM);
  collideX(player);
  collideY(player);
  if(player.onGround && mv!==0) player.anim+=0.22; else player.anim=0;

  // ショット
  if(player.shootCD>0)player.shootCD--;
  const sh=!!keys[KSHOOT];
  if(sh)player.charge=Math.min(player.charge+1,60);
  if(PRESS[KSHOOT] && player.shootCD<=0){           // 押した瞬間に通常弾
    shootP(player.x+(player.dir>0?20:-12), player.y-3, player.dir, false);   // 塗り2D砲口に合わせた発射位置
    player.shootCD=11;
  }
  if(player.wasShoot && !sh){                        // 離した瞬間：チャージ判定
    if(player.charge>=40) shootP(player.x+(player.dir>0?16:-16), player.y-7, player.dir, true);
    player.charge=0;
  }
  player.wasShoot=sh;

  if(player.inv>0)player.inv--;
  player.blink++;

  if(player.y>H+60) hurt(99,true);  // 落下死
}

function hurt(dmg,fall){
  if(player.dead) return;
  if(player.inv>0 && !fall) return;
  player.hp-=dmg; player.inv=60;
  if(player.hp<=0){player.hp=0;player.dead=true;player.deadT=0;sfx('boom');}
  else{ sfx('hurt'); if(!fall){player.vy=-3.5;player.vx=-player.dir*2;} }
}

//======================================================================
//  パーティクル
//======================================================================
const fx=[];
function boom(x,y,col){ for(let i=0;i<10;i++){const a=i/10*Math.PI*2;fx.push({x,y,vx:Math.cos(a)*rnd(1,3),vy:Math.sin(a)*rnd(1,3),life:rnd(14,26),col});} }
function updateFx(){ for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;} for(let i=fx.length-1;i>=0;i--)if(fx[i].life<=0)fx.splice(i,1); }

//======================================================================
//  敵
//======================================================================
let enemies=[];
const mkE=(type,x,y,o={})=>Object.assign({type,x,y,w:20,h:18,hp:2,alive:true,t:0,vx:0,vy:0,
  dir:-1,hit:0,onGround:false,phase:'hide',timer:0,baseY:y,deathT:0},o);

function buildEnemies(){
  // 当たり判定は見た目(塗り2D)に合わせて高めに＝同じ高さの弾が当たる。地上敵は h28 で底辺を地面に。
  const G=(type,x,o={})=>mkE(type,x,GROUND_Y-28,Object.assign({w:type==='turret'?24:22,h:28},o));
  enemies=[
    G('met',   380,{hp:2}),
    G('walker',560,{hp:2,dir:-1}),
    mkE('flyer', 760,160,{w:24,h:22,hp:1}),
    mkE('met',   840,176-28,{w:22,h:28,hp:2}),          // 足場上
    G('walker',1000,{hp:2,dir:1}),
    G('turret',1110,{hp:3}),
    mkE('flyer',1380,150,{w:24,h:22,hp:1}),
    mkE('walker',1450,150-28,{w:22,h:28,hp:2,dir:1}),   // 足場上(ハザード横)
    G('met',   1700,{hp:2}),
    mkE('turret',2340,144-28,{w:24,h:28,hp:3}),         // 高所砲台
    G('walker',2200,{hp:2,dir:-1}),
    mkE('flyer',2420,160,{w:24,h:22,hp:1}),
    G('met',   2720,{hp:2}),
    G('walker',2960,{hp:2,dir:1}),
    mkE('flyer',3100,155,{w:24,h:22,hp:1}),
    G('met',   3450,{hp:2}),
    G('turret',3560,{hp:3}),
  ];
}

function eGravity(o){
  o.vy=clamp(o.vy+GRAV,-20,TERM); o.y+=o.vy; o.onGround=false;
  for(const s of solids) if(aabb(o,s)){ if(o.vy>0){o.y=s.y-o.h;o.onGround=true;} else o.y=s.y+s.h; o.vy=0; }
}
function patrol(o,spd){
  // 進行方向の足元に床が無ければ反転、壁でも反転
  const footX = o.dir>0 ? o.x+o.w+1 : o.x-1;
  const footY = o.y+o.h+2;
  let ground=false, wall=false;
  for(const s of solids){
    if(footX>=s.x && footX<=s.x+s.w && footY>=s.y && footY<=s.y+10) ground=true;
  }
  o.x += o.dir*spd;
  for(const s of solids) if(aabb(o,s)){ o.x = o.dir>0 ? s.x-o.w : s.x+s.w; wall=true; }
  if(!ground || wall) o.dir*=-1;
}

function updateEnemies(){
  for(const e of enemies){
    if(!e.alive){e.deathT++;continue;}
    e.t++; if(e.hit>0)e.hit--;
    const seen = e.x>camX-80 && e.x<camX+W+80;

    if(e.type==='met'){
      eGravity(e); e.timer++;
      if(e.phase==='hide'){ if(seen && e.timer>60){e.phase='open';e.timer=0;} }
      else { // open
        if(e.timer===16){
          const d=sign(player.x-e.x)||-1;
          shootE(e.x+e.w/2,e.y+6,d*2.4,-1.3,'#ffd23f');
          shootE(e.x+e.w/2,e.y+6,d*2.8, 0  ,'#ffd23f');
          shootE(e.x+e.w/2,e.y+6,d*2.4, 1.3,'#ffd23f');
        }
        if(e.timer>70){e.phase='hide';e.timer=0;}
      }
    }
    else if(e.type==='walker'){ eGravity(e); patrol(e,0.8); }
    else if(e.type==='flyer'){
      e.x-=0.95; e.y=e.baseY+Math.sin(e.t*0.07)*24;
      if(e.x < camX-100){ e.x=camX+W+40; e.baseY=rnd(70,150); }
    }
    else if(e.type==='turret'){
      eGravity(e); e.timer++;
      if(seen && e.timer>90){
        e.timer=0;
        const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
        shootE(e.x+e.w/2,e.y+8,dx/d*2.6,dy/d*2.6,'#5ad1ff');
      }
    }

    if(!player.dead && aabb(player,e)) hurt(3,false);
  }
  for(let i=enemies.length-1;i>=0;i--) if(!enemies[i].alive && enemies[i].deathT>16) enemies.splice(i,1);
}

//======================================================================
//  ボス
//======================================================================
let boss=null, bossActive=false, gate=false, warnT=0;
function spawnBoss(){
  boss={x:ROOM_X+360,y:GROUND_Y-46,w:36,h:46,hp:30,maxhp:30,vx:0,vy:0,dir:-1,
    onGround:false,state:'intro',timer:0,hit:0,jumps:0,dead:false,deadT:0};
  bossActive=true; gate=true; warnT=90;
}
function bossPick(){
  const r=Math.random();
  boss.state = r<0.4?'jump' : r<0.72?'shoot' : 'dash';
  boss.timer=0; boss.jumps=0;
}
function updateBoss(){
  if(!boss)return;
  if(warnT>0)warnT--;
  boss.timer++; if(boss.hit>0)boss.hit--;
  eGravity(boss);
  if(boss.dead){boss.deadT++; if(boss.deadT%6===0)boom(boss.x+rnd(0,boss.w),boss.y+rnd(0,boss.h),'#ff7a00'); return;}
  if(boss.state==='intro'){ if(boss.timer>90){boss.state='think';boss.timer=0;} return; }

  boss.dir = player.x < boss.x ? -1 : 1;

  if(boss.state==='think'){ boss.vx=0; if(boss.timer>36) bossPick(); }
  else if(boss.state==='jump'){
    if(boss.onGround){ boss.vy=JUMP*1.02; boss.vx=boss.dir*2.3; boss.jumps++; }
    boss.x+=boss.vx;
    for(const s of solids) if(aabb(boss,s)){ boss.x = boss.vx>0 ? s.x-boss.w : s.x+s.w; boss.vx*=-1; }
    if(boss.onGround && boss.jumps>=2){ boss.state='shoot'; boss.timer=0; boss.vx=0; }
  }
  else if(boss.state==='shoot'){
    if(boss.timer===18||boss.timer===38||boss.timer===58){
      for(let i=-2;i<=2;i++){
        const ang=(boss.dir>0?0:Math.PI)+i*0.30;
        shootE(boss.x+boss.w/2, boss.y+18, Math.cos(ang)*3.1, Math.sin(ang)*3.1, '#ff7a00');
      }
    }
    if(boss.timer>78){ boss.state='think'; boss.timer=0; }
  }
  else if(boss.state==='dash'){
    boss.vx=boss.dir*4.6; boss.x+=boss.vx;
    for(const s of solids) if(aabb(boss,s)){ boss.x = boss.vx>0 ? s.x-boss.w : s.x+s.w; boss.state='think'; boss.timer=0; }
    if(boss.timer>48){ boss.state='think'; boss.timer=0; }
  }

  boss.x=clamp(boss.x, ROOM_X+20, ROOM_X+W-boss.w-20);
  if(!player.dead && aabb(player,boss)) hurt(4,false);
}

//  弾の更新＋当たり

function updateBullets(){
  for(const b of pBullets){
    b.x+=b.vx; b.life--;
    for(const s of solids) if(aabb(b,s)){ b.life=0; boom(b.x,b.y,'#9fd8ff'); }
    if(b.life<=0) continue;
    for(const e of enemies){
      if(!e.alive) continue;
      if(aabb(b,e)){
        const guarded = (e.type==='met' && e.phase==='hide'); // メットは隠れてると無敵
        if(guarded){ if(!b.charge){b.life=0;} boom(b.x,b.y,'#ffd23f'); }
        else{
          e.hp-=b.dmg; e.hit=6;
          if(e.hp<=0){ e.alive=false; e.deathT=0; boom(e.x+e.w/2,e.y+e.h/2,'#ff9a3c'); sfx('boom'); }
          else sfx('hit');
          if(!b.charge){ b.life=0; }
        }
        if(!b.charge) break;
      }
    }
    if(b.life<=0) continue;
    if(boss && !boss.dead && boss.state!=='intro' && aabb(b,boss)){
      boss.hp-=b.dmg; boss.hit=6; sfx('hit');
      if(!b.charge) b.life=0;
      if(boss.hp<=0){ boss.hp=0; boss.dead=true; boss.deadT=0; sfx('boom'); }
    }
  }
  for(const b of eBullets){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    for(const s of solids) if(aabb(b,s)){ b.life=0; }
    if(b.life>0 && !player.dead && aabb(b,player)){ hurt(2,false); b.life=0; }
  }
  for(let i=pBullets.length-1;i>=0;i--) if(pBullets[i].life<=0) pBullets.splice(i,1);
  for(let i=eBullets.length-1;i>=0;i--) if(eBullets[i].life<=0) eBullets.splice(i,1);
}

let state='title';   // title / play / dead / clear
let clearT=0, shake=0;

function startGame(){
  resetPlayer(); buildEnemies(); buildItems();
  pBullets.length=0; eBullets.length=0; fx.length=0;
  boss=null; bossActive=false; gate=false; warnT=0;
  camX=0; clearT=0; state='play';
}

function update(){
  if(state==='title'){ if(PRESS[KENTER]) startGame(); return; }
  if(state==='dead'){ player.deadT++; if(PRESS[KENTER]) startGame(); return; }
  if(state==='clear'){ clearT++; if(PRESS[KENTER]) state='title'; return; }

  updatePlayer();
  updateEnemies();
  updateItems();
  for(const hz of hazards){ if(!player.dead && aabb(player,hz)) hurt(3,false); }  // スパイク帯

  if(!bossActive && player.x>BOSS_TRIGGER) spawnBoss();
  if(bossActive){
    player.x=clamp(player.x, ROOM_X+14, ROOM_X+W-player.w-6); // 部屋に閉じ込め
    updateBoss();
    if(boss.dead && boss.deadT>110){ state='clear'; }
  }

  updateBullets();
  updateFx();

  // カメラ
  let tgt = bossActive ? ROOM_X : clamp(player.x-W/2+player.w/2, 0, LEVEL_W-W);
  camX += (tgt-camX)*0.2;
  if(Math.abs(tgt-camX)<0.5) camX=tgt;
  if(shake>0)shake--;

  if(player.dead && player.deadT>80 && state==='play') state='dead';
}

function _tileX(r, dx, dy, dw, dh){
  const iw=r.img.width, ih=r.img.height, sc=dh/ih, uw=Math.max(1,iw*sc);
  for(let t=0; t<dw; t+=uw){ const seg=Math.min(uw, dw-t);
    ctx.drawImage(r.img, 0,0, Math.max(1,iw*(seg/uw)), ih, Math.round(dx+t), Math.round(dy), Math.ceil(seg), Math.round(dh)); }
}
function drawTerrainSolid(s){
  if(!ctx) return false;
  const x=s.x-camX, ground=s.h>=40;
  if(ground){
    const f=TERRAIN.groundFill && getImg(TERRAIN.groundFill.src);
    if(f && f.ready && f.img){
      _tileX(f, x, s.y, s.w, s.h);
      const t=TERRAIN.groundTop && getImg(TERRAIN.groundTop.src);
      if(t && t.ready && t.img) _tileX(t, x, s.y, s.w, TERRAIN.groundTop.h||14);

    }
  } else {
    const p=TERRAIN.platform && getImg(TERRAIN.platform.src);
    if(p && p.ready && p.img){ ctx.drawImage(p.img, 0,0,p.img.width,p.img.height, Math.round(x), Math.round(s.y), Math.round(s.w), Math.round(s.h)); return true; }
  }
  return false;
}

    px(x-3,y+wy,6,3,'#bdf0ff'); px(x+17,y+wy,6,3,'#bdf0ff');     // 翼
    px(x+3,y+4,14,10,f?'#fff':'#2f9fd8'); px(x+3,y+4,14,3,'#9fe8ff'); px(x+3,y+12,14,2,'#1d6e9c');
    px(x+5,y+7,3,3,'#ff3b3b'); px(x+12,y+7,3,3,'#ff3b3b'); px(x+5,y+7,1,1,'#fff'); px(x+12,y+7,1,1,'#fff');
  }else if(e.type==='turret'){
    px(x+1,y+9,22,18,Ob); px(x+5,y+1,14,11,Ob);                  // アウトライン
    px(x+2,y+10,20,16,f?'#fff':'#5a6488'); px(x+2,y+10,20,3,'#8a96bc'); px(x+2,y+23,20,3,'#2e3550');
    px(x+6,y+2,12,10,f?'#fff':'#39507a'); px(x+6,y+2,12,2,'#5a78aa');
    const d=sign(player.x-e.x)||-1; px(x+(d>0?15:2),y+5,9,4,'#161c30'); px(x+9,y+14,6,4,'#ff5a4a'); px(x+10,y+15,4,2,'#ffd0c0');
  }
}

function drawBoss(){
  if(!boss)return;
  const x=Math.round(boss.x-camX), y=Math.round(boss.y), d=boss.dir;
  const f=boss.hit>0 && Math.floor(boss.hit/2)%2===0;
  if(boss.dead){
    if(drawSheet('boss','death', boss.deadT, boss.x-camX+boss.w/2, boss.y+boss.h, boss.dir)) return;
    return;
  }
  // 高精細スプライト優先（state→アニメ）
  const _bs = boss.state==='shoot'?'shoot' : boss.state==='dash'?'dash' : boss.state==='jump'?'jump' : 'idle';
  if(drawSheet('boss', _bs, boss.timer, boss.x-camX+boss.w/2, boss.y+boss.h, boss.dir)) return;
  ctx.save();
  if(d<0){ctx.translate(x+boss.w,y);ctx.scale(-1,1);} else ctx.translate(x,y);
  const C=f?'#fff':'#d63a2a', C2=f?'#fff':'#a01f12', HL=f?'#fff':'#ff7a5a', O='#2a0603';
  // --- アウトライン ---
  px(3,37,12,9,O); px(21,37,12,9,O); px(4,15,30,26,O); px(8,1,22,17,O); px(27,17,12,14,O); px(-1,19,9,12,O);
  px(10,-1,5,4,O); px(22,-1,5,4,O);
  // --- 脚 ---
  px(4,38,9,8,C2); px(22,38,9,8,C2); px(4,44,11,2,'#3a0a05'); px(20,44,11,2,'#3a0a05');
  // --- 胴 ---
  px(5,16,28,24,C); px(5,16,28,4,HL); px(5,34,28,4,C2);
  px(11,21,16,12,'#3a0a05'); px(12,22,14,10,'#ffd23f'); px(15,24,8,6,'#ff7a00'); px(13,23,3,3,'#ffe88a'); // 胸コア
  // --- 腕／キャノン ---
  px(28,18,10,12,C2); px(28,18,10,3,HL); px(36,20,5,8,'#222'); px(0,20,7,10,C2);
  // --- 頭 ---
  px(9,2,20,15,C); px(9,2,20,4,HL); px(13,7,5,5,'#fff'); px(20,7,5,5,'#fff'); px(14,8,3,3,'#ff1a1a'); px(21,8,3,3,'#ff1a1a');
  px(11,0,4,4,'#ffd23f'); px(23,0,4,4,'#ffd23f'); px(15,13,8,2,'#3a0a05');
  ctx.restore();
}

function drawBullets(){
  for(const b of pBullets){
    if(drawBulletSpr(b.charge?BULLET_SPR.charge:BULLET_SPR.buster, b)) continue;
    const x=b.x-camX;
    if(b.charge){ px(x,b.y,b.w,b.h,'#bff0ff'); px(x+2,b.y+2,b.w-4,b.h-4,'#5ad1ff'); px(x+4,b.y+4,b.w-8,b.h-8,'#fff'); }
    else{ px(x,b.y,b.w,b.h,'#aef0ff'); px(x+1,b.y+1,b.w-2,b.h-2,'#7fd8ff'); }
  }
  for(const b of eBullets){
    if(drawBulletSpr(BULLET_SPR.enemy, b)) continue;
    px(b.x-camX,b.y,b.w,b.h,b.c); px(b.x-camX+1,b.y+1,b.w-2,b.h-2,'#fff');
  }
}
function drawFx(){ for(const p of fx){ px(p.x-camX,p.y,3,3,p.life>8?'#fff':p.col); } }

// HPバー画像（枠＋内側fill。無ければ下のコードゲージ）。fill領域は素材に合わせ調整。
const UI_SPR = {
  // hp  :{src:'assets/ui_hp.png',      x:10,    y:8, w:104, h:20, fill:{x:8,y:6,w:88,h:8}},
  // boss:{src:'assets/ui_hp_boss.png', x:W-114, y:8, w:104, h:18, fill:{x:8,y:5,w:88,h:8}, rtl:true},
};
function hpBarImg(cfg, frac){
  const r=getImg(cfg.src); if(!r||!r.ready||!r.img||!ctx) return false;
  const f=cfg.fill; px(cfg.x+f.x, cfg.y+f.y, f.w, f.h, '#0e1530');         // 下地
  const fw=Math.max(0,Math.round(f.w*clamp(frac,0,1)));
  const ox=cfg.rtl ? cfg.x+f.x+f.w-fw : cfg.x+f.x;
  for(let i=0;i<fw;i++){ const t=(cfg.rtl?(f.w-1-i):i)/Math.max(1,f.w-1);
    ctx.fillStyle = cfg.boss ? (t<0.5?'#ff7a00':'#ffd23f') : (t<0.25?'#ff5a4a':t<0.5?'#ffd23f':'#5ad1ff');
    ctx.fillRect((cfg.rtl?cfg.x+f.x+f.w-1-i:ox+i)|0, (cfg.y+f.y)|0, 1, f.h); }
  ctx.drawImage(r.img,0,0,r.img.width,r.img.height, cfg.x,cfg.y,cfg.w,cfg.h);  // 枠を上に
  return true;
}
function hpGauge(){
  px(8,8,12,player.maxhp*2+8,'#0a0e1a'); px(9,9,10,player.maxhp*2+6,'#16203c');
  for(let i=0;i<player.maxhp;i++){ const yy=10+(player.maxhp-1-i)*2; px(10,yy,8,2, i<player.hp?(i<4?'#ff5a4a':'#5ad1ff'):'#0e1530'); }
  px(8,4,12,3,'#ffd23f');
}
function bossGauge(){
  const bx=W-20; px(bx,8,12,boss.maxhp*1.4+8,'#0a0e1a');
  for(let i=0;i<boss.maxhp;i++){ const yy=10+(boss.maxhp-1-i)*1.4; px(bx+2,yy,8,1.4, i<boss.hp?'#ff7a00':'#0e1530'); }
  px(bx,4,12,3,'#ff3b3b');
}
function drawHUD(){
  if(!(UI_SPR.hp && hpBarImg(UI_SPR.hp, player.hp/player.maxhp))) hpGauge();
  if(bossActive && boss && !boss.dead){
    if(!(UI_SPR.boss && hpBarImg(Object.assign({boss:true},UI_SPR.boss), boss.hp/boss.maxhp))) bossGauge();
  }
}
function drawGate(){
  if(gate && boss && !boss.dead){
    const gx=ROOM_X+2-camX;
    if(gx>-20 && gx<W){ px(gx,30,14,GROUND_Y-30,'#444c6e'); for(let yy=30;yy<GROUND_Y;yy+=16){px(gx,yy,14,3,'#22273f');px(gx+2,yy+5,10,6,'#5a6488');} }
  }
}

function text(s,x,y,sz,c,al='center'){ if(!ctx)return; ctx.fillStyle=c; ctx.font='bold '+sz+'px "Courier New",monospace'; ctx.textAlign=al; ctx.textBaseline='alphabetic'; ctx.fillText(s,x,y); }

function drawTitle(){
  bg(); const t=now()/300;
  text('COBALT',W/2,86,42,'#0a0e1a'); if(ctx){ctx.fillStyle='#5ad1ff';ctx.fillText('COBALT',W/2-2,84);}
  text('BOLT',W/2,126,42,'#0a0e1a'); if(ctx){ctx.fillStyle='#ffd23f';ctx.fillText('BOLT',W/2-2,124);}
  text('- 横スクロールアクション -',W/2,150,11,'#aeb8ff');
  if(Math.floor(t)%2===0) text('PRESS  ENTER',W/2,196,18,'#fff');
  text('← → 移動   Z ジャンプ   X ショット(長押しチャージ)',W/2,236,10,'#7a86b0');
}
function drawDead(){ if(!ctx)return; ctx.fillStyle='rgba(5,6,12,.78)'; ctx.fillRect(0,0,W,H); text('GAME OVER',W/2,120,38,'#ff3b3b'); text('PRESS ENTER TO RETRY',W/2,158,14,'#fff'); }
function drawClear(){
  bg(); if(ctx){ctx.fillStyle='rgba(5,6,20,.5)';ctx.fillRect(0,0,W,H);}
  text('STAGE CLEAR!',W/2,110,36,'#0a0e1a'); if(ctx){ctx.fillStyle='#ffd23f';ctx.textAlign='center';ctx.fillText('STAGE CLEAR!',W/2-2,108);}
  text('ボスを撃破した！',W/2,142,14,'#fff');
  if(Math.floor(now()/400)%2===0) text('PRESS ENTER',W/2,184,16,'#aef0ff');
  for(let i=0;i<30;i++){ const cx=(i*61+now()*0.05*((i%2)?1:-1))%W, cy=(i*40+now()*0.08)%H; px(cx,cy,3,3,['#ff5a4a','#5ad1ff','#ffd23f','#7fff9f'][i%4]); }
}

function render(){
  if(!ctx)return;
  if(ctx.setTransform)ctx.setTransform(RS,0,0,RS,0,0);   // ワールド→1920x1080(4倍)基準変換
  ctx.save();
  if(shake>0)ctx.translate(rnd(-shake,shake)*0.4,rnd(-shake,shake)*0.4);
  if(state==='title'){ drawTitle(); ctx.restore(); return; }
  if(state==='clear'){ drawClear(); ctx.restore(); return; }
  bg(); drawSolids(); drawHazards(); drawGate(); drawItems();
  for(const e of enemies) drawEnemy(e);
  drawBoss(); drawBullets(); drawPlayer(); drawFx(); drawHUD();
  if(warnT>0 && boss) text('WARNING!',W/2,60,22,(Math.floor(warnT/6)%2?'#ff3b3b':'#fff'));
  if(state==='dead') drawDead();
  ctx.restore();
}

//======================================================================
//  ループ
//======================================================================
function frame(){ update(); render(); for(const k in PRESS)PRESS[k]=false; }
function loop(){ frame(); requestAnimationFrame(loop); }
loadAssets();
if(!HEADLESS && typeof requestAnimationFrame!=='undefined') loop();

//======================================================================
//  テスト用フック（ヘッドレス検証用）
//======================================================================
if(typeof globalThis!=='undefined'){
  globalThis.__GAME={
    get state(){return state}, get player(){return player}, get enemies(){return enemies},
    get boss(){return boss}, get bossActive(){return bossActive},
    get pBullets(){return pBullets}, get eBullets(){return eBullets},
    get camX(){return camX}, get solids(){return solids}, get items(){return items}, get hazards(){return hazards},
    consts:{W,H,GROUND_Y,LEVEL_W,ROOM_X,BOSS_TRIGGER,PW,PH},
    start:startGame,
    draw(){ render(); },                                          // 現在状態を描画（スクショ検証用）
    assets:ASSETS, loadAssets,                                    // スプライト検証用
    set state(v){ state=v; },                                     // テスト用に画面状態を直接指定
    step(){ update(); for(const k in PRESS)PRESS[k]=false; },     // 1フレーム進める（描画なし）
    hold(k){ if(!keys[k])PRESS[k]=true; keys[k]=true; },
    release(k){ keys[k]=false; },
    releaseAll(){ for(const k in keys)keys[k]=false; for(const k in PRESS)PRESS[k]=false; },
  };
}

})();
</script>
